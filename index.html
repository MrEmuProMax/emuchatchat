<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>線上聊天大廳</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js 通訊庫 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #0b1120;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        user-select: none;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.2);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      }
      .custom-btn {
        background: #0284c7;
        color: #ffffff;
        font-weight: 500;
        transition: all 0.15s ease;
      }
      .custom-btn:hover {
        background: #0369a1;
        box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
      }
      .input-box {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(51, 65, 85, 0.8);
        color: #f8fafc;
        transition: all 0.2s ease;
      }
      .input-box:focus {
        border-color: #38bdf8;
        outline: none;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body class="text-slate-100 flex items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- 1. 登入面板 -->
    <div id="login-panel" class="relative z-10 w-full max-w-sm glass-panel rounded-2xl p-7 flex flex-col gap-5 backdrop-blur-md">
      <div class="text-center">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
          聊天室大廳
        </h1>
        <p class="text-xs text-slate-400 mt-1.5">MQTT QoS 1 高可靠連線傳輸</p>
      </div>

      <!-- 自訂頭像選取區 -->
      <div class="flex items-center gap-3.5 bg-slate-900/80 border border-slate-700/80 p-3 rounded-xl">
        <div class="relative group cursor-pointer w-14 h-14 rounded-xl bg-slate-800 border border-slate-600 overflow-hidden flex-shrink-0 flex items-center justify-center" onclick="document.getElementById('avatar-file').click()">
          <img id="avatar-preview" src="" class="w-full h-full object-cover hidden" />
          <span id="avatar-placeholder" class="text-xs text-slate-400">頭像</span>
          <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="text-[11px] text-sky-300 font-medium">更換</span>
          </div>
        </div>
        <input id="avatar-file" type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
        <div class="flex flex-col gap-1.5 flex-1">
          <div class="flex gap-2">
            <button type="button" onclick="document.getElementById('avatar-file').click()" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg transition-colors">
              上傳照片
            </button>
            <button type="button" onclick="resetDefaultAvatar()" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg transition-colors">
              隨機頭像
            </button>
          </div>
          <span class="text-[11px] text-slate-400">點擊頭像即可自訂圖片</span>
        </div>
      </div>

      <!-- 表單 -->
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">你的暱稱</label>
          <input id="input-username" type="text" maxlength="12" value="Player" placeholder="輸入你想使用的暱稱..."
            class="input-box w-full px-3.5 py-2.5 text-sm rounded-xl" />
        </div>

        <button onclick="joinLobby()" class="custom-btn py-3 rounded-xl text-sm font-semibold tracking-wide mt-1">
          進入公共大廳
        </button>

        <div id="conn-hint" class="text-xs text-center text-slate-400">
          準備就緒
        </div>
      </div>
    </div>

    <!-- 2. 主聊天大廳介面 -->
    <div id="lobby-panel" class="relative z-20 hidden w-[98vw] h-[95vh] max-w-7xl glass-panel rounded-2xl shadow-2xl backdrop-blur-md flex overflow-hidden">
      
      <!-- [左側] 大廳切換欄 (僅保留公共大廳與自訂大廳) -->
      <div class="w-56 bg-slate-900/80 border-r border-slate-800 flex flex-col justify-between flex-shrink-0">
        <div>
          <div class="p-3 border-b border-slate-800 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-200 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-sky-400"></span> 頻道列表
            </span>
            <button onclick="promptCreateRoom()" title="建立或加入自訂大廳" class="px-2 py-0.5 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded font-bold transition-colors">
              ＋
            </button>
          </div>

          <div class="p-2 flex flex-col gap-1 overflow-y-auto max-h-[calc(100vh-180px)]" id="room-list">
            <!-- 由 JS 動態生成大廳項目 -->
          </div>
        </div>

        <!-- 底部個人資訊 -->
        <div class="p-3 border-t border-slate-800 bg-slate-950/40 flex items-center justify-between">
          <div class="flex items-center gap-2 overflow-hidden">
            <img id="my-profile-avatar" src="" class="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0" />
            <div class="flex flex-col overflow-hidden">
              <span id="my-profile-name" class="text-xs font-semibold text-white truncate">Player</span>
              <span class="text-[10px] text-emerald-400">QoS 1 連線中</span>
            </div>
          </div>
          <button onclick="leaveLobby()" title="離開大廳" class="text-xs text-red-400 hover:text-red-300 p-1.5 rounded hover:bg-slate-800">
            離開
          </button>
        </div>
      </div>

      <!-- [中央與右側] 主聊天室與成員 -->
      <div class="flex-1 flex flex-col justify-between overflow-hidden">
        
        <!-- 頂部資訊列 -->
        <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center flex-shrink-0">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-900 border border-slate-700/80 px-3 py-1 rounded-lg">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="lobby-title" class="text-xs font-semibold text-white">大廳: 公共大廳</span>
            </div>
            <span class="text-xs text-slate-300">
              線上成員：<span id="online-count" class="text-emerald-400 font-bold">1</span> 人
            </span>
          </div>

          <div class="flex items-center gap-3">
            <span class="text-xs text-slate-400">延遲：<span id="ping-stat" class="text-emerald-400 font-medium">0ms</span></span>
          </div>
        </div>

        <!-- 中央區塊：聊天訊息 + 在線成員名單 -->
        <div class="flex-1 flex overflow-hidden p-3 gap-3">
          <!-- 聊天捲軸區 -->
          <div class="flex-1 bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between overflow-hidden">
            <div id="chat-scroller" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 text-sm"></div>
          </div>

          <!-- 右側在線人員 -->
          <div class="w-56 bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col flex-shrink-0">
            <div class="text-xs font-semibold text-slate-300 mb-2 pb-2 border-b border-slate-700/60 flex justify-between items-center">
              <span>大廳成員</span>
              <span class="text-emerald-400 text-[11px] font-normal">即時同步</span>
            </div>
            <div id="player-list" class="flex-1 overflow-y-auto flex flex-col gap-1.5"></div>
          </div>
        </div>

        <!-- 底部通訊工具列 -->
        <div class="p-3 border-t border-slate-800 bg-slate-950/40 flex flex-col gap-2 flex-shrink-0">
          <div class="flex items-center gap-2">
            <input id="file-upload-input" type="file" multiple class="hidden" onchange="handleFilesSelected(event)" />

            <button onclick="document.getElementById('file-upload-input').click()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors">
              <span>📎 傳送檔案</span>
            </button>

            <!-- 傳輸進度狀態列 -->
            <div id="transfer-progress-bar" class="hidden items-center gap-2 bg-slate-900 border border-sky-500/40 px-3 py-1 rounded-lg text-xs text-sky-300">
              <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
              <span id="transfer-progress-text">準備傳輸中...</span>
              <button onclick="cancelActiveUpload()" class="ml-2 text-xs text-red-400 hover:text-red-300 underline font-medium">取消</button>
            </div>
          </div>

          <div class="flex gap-2">
            <input
              id="chat-input"
              type="text"
              maxlength="300"
              placeholder="輸入訊息... (按 Enter 發送)"
              onkeydown="if(event.key === 'Enter') sendTextMessage();"
              class="input-box flex-1 px-4 py-2.5 rounded-xl text-sm"
            />
            <button onclick="sendTextMessage()" class="custom-btn px-6 py-2.5 rounded-xl text-sm font-semibold">
              發送
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 圖片放大預覽視窗 -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center hidden p-4" onclick="this.classList.add('hidden')">
      <img id="image-modal-preview" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl border border-slate-700 shadow-2xl" />
    </div>

    <script>
      /* ============================================================
         1. 核心網路通訊與大廳狀態管理 (一律 QOS 1)
         ============================================================ */
      const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
      const LOBBY_PREFIX = "chat_reliable_v2/";
      
      let myId = "";
      let client = null;
      let myName = "Player";
      let myAvatar = "";

      // 只有公共大廳與自訂大廳
      const availableRooms = ["公共大廳"];
      let currentRoom = "公共大廳";
      let currentTopic = "";

      const members = new Map();
      let pingLoop = null;
      let checkLoop = null;

      // 檔案傳輸任務池
      const uploadQueue = [];
      let totalBatchFiles = 0;
      let completedBatchFiles = 0;
      const activeUploads = new Map();
      const incomingFiles = new Map();

      // 切片大小：64KB，在 QoS 1 下具備極佳穩定度與確認速度
      const CHUNK_SIZE = 64 * 1024;

      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      function makeDefaultAvatar(char = "P") {
        const colors = ["#0284c7", "#2563eb", "#7c3aed", "#059669", "#d97706"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="${color}"/>
          <text x="32" y="42" font-size="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">${char.slice(0, 1).toUpperCase()}</text>
        </svg>`;
        return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
      }

      function resetDefaultAvatar() {
        const name = document.getElementById("input-username").value.trim() || "P";
        myAvatar = makeDefaultAvatar(name);
        setAvatarImg(myAvatar);
      }

      function setAvatarImg(src) {
        const img = document.getElementById("avatar-preview");
        img.src = src;
        img.classList.remove("hidden");
        document.getElementById("avatar-placeholder").classList.add("hidden");
      }

      function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const cv = document.createElement("canvas");
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext("2d");
            const minSide = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - minSide) / 2, (img.height - minSide) / 2, minSide, minSide, 0, 0, 64, 64);
            myAvatar = cv.toDataURL("image/webp", 0.75);
            setAvatarImg(myAvatar);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getSafeTopic(roomName) {
        let hash = 0;
        for (let i = 0; i < roomName.length; i++) hash = ((hash << 5) - hash) + roomName.charCodeAt(i);
        return "room_" + Math.abs(hash);
      }

      function readSliceAsBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const commaIndex = dataUrl.indexOf(",");
            resolve(commaIndex !== -1 ? dataUrl.substring(commaIndex + 1) : dataUrl);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function base64ToUint8(base64) {
        const binStr = atob(base64);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        return bytes;
      }

      // 發送 MQTT 封包：一律使用 QOS 1
      function sendData(data) {
        if (!client || !client.connected) return false;
        data.senderId = myId;
        client.publish(currentTopic, JSON.stringify(data), { qos: 1 });
        return true;
      }

      /* ============================================================
         2. 大廳切換與自訂大廳管理
         ============================================================ */
      function renderRoomList() {
        const container = document.getElementById("room-list");
        container.innerHTML = "";

        availableRooms.forEach(room => {
          const isActive = (room === currentRoom);
          const btn = document.createElement("button");
          btn.onclick = () => switchRoom(room);
          btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs transition-all flex items-center justify-between ${
            isActive
              ? "bg-sky-600 text-white font-semibold shadow"
              : "text-slate-400 hover:bg-slate-800 hover:text-slate-200"
          }`;
          btn.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span class="text-xs ${isActive ? 'text-white' : 'text-slate-500'}">#</span>
              <span class="truncate">${room}</span>
            </div>
            ${isActive ? '<span class="w-1.5 h-1.5 rounded-full bg-white flex-shrink-0"></span>' : ''}
          `;
          container.appendChild(btn);
        });
      }

      function promptCreateRoom() {
        const name = prompt("請輸入欲自訂的大廳名稱:", "");
        if (!name) return;
        const cleanName = name.trim();
        if (!cleanName) return;

        if (!availableRooms.includes(cleanName)) {
          availableRooms.push(cleanName);
        }
        switchRoom(cleanName);
      }

      function switchRoom(newRoom) {
        if (!client || !client.connected) return;
        if (currentRoom === newRoom) return;

        // 1. 退出舊大廳 (QoS 1)
        sendData({ type: "PLAYER_LEAVE", name: myName });
        client.unsubscribe(currentTopic);

        // 2. 切換大廳狀態
        currentRoom = newRoom;
        currentTopic = LOBBY_PREFIX + getSafeTopic(currentRoom);

        members.clear();
        members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("lobby-title").innerText = `大廳: ${currentRoom}`;
        renderMemberList();
        renderRoomList();

        appendNotice(`已切換至 [${currentRoom}]`);

        // 3. 訂閱新主題 (QoS 1)
        client.subscribe(currentTopic, { qos: 1 }, (err) => {
          if (!err) {
            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
          }
        });
      }

      function joinLobby() {
        myId = "u_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

        const nameInput = document.getElementById("input-username").value.trim();
        myName = nameInput || "Player";
        if (!myAvatar) myAvatar = makeDefaultAvatar(myName);

        currentRoom = "公共大廳";
        currentTopic = LOBBY_PREFIX + getSafeTopic(currentRoom);

        document.getElementById("conn-hint").innerText = "連線伺服器中 (QoS 1)...";

        // 連線與遺言 (will) 一律使用 QoS 1
        client = mqtt.connect(BROKER_URL, {
          clientId: myId,
          clean: true,
          connectTimeout: 10000,
          reconnectPeriod: 2000,
          will: {
            topic: currentTopic,
            payload: JSON.stringify({ type: "PLAYER_LEAVE", senderId: myId, name: myName }),
            qos: 1
          }
        });

        client.on("connect", () => {
          // 訂閱大廳主題：一律 QoS 1
          client.subscribe(currentTopic, { qos: 1 }, (err) => {
            if (err) {
              alert("連線大廳失敗，請重新嘗試！");
              leaveLobby();
              return;
            }

            document.getElementById("login-panel").classList.add("hidden");
            document.getElementById("lobby-panel").classList.remove("hidden");
            document.getElementById("lobby-title").innerText = `大廳: ${currentRoom}`;
            document.getElementById("my-profile-name").innerText = myName;
            document.getElementById("my-profile-avatar").src = myAvatar;

            renderRoomList();
            members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
            renderMemberList();

            appendNotice(`歡迎來到公共大廳！(QoS 1 已啟用)`);

            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
            startHeartbeat();
          });
        });

        client.on("message", (topic, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.senderId === myId) return;
            handleMessage(msg);
          } catch (e) {}
        });

        client.on("error", () => {
          document.getElementById("conn-hint").innerText = "連線短暫不穩定，自動連線中...";
        });
      }

      function handleMessage(msg) {
        const senderId = msg.senderId;
        if (!senderId) return;

        switch (msg.type) {
          case "CHAT_TEXT":
            appendChatMessage(msg.name, msg.text, msg.avatar, "text", false, senderId);
            break;

          // 步驟 1: 接收端接收到所有封包數與資訊
          case "FILE_HEADER_START":
            handleFileHeaderStart(msg);
            break;

          // 步驟 2: 每個封包最前面都帶著編號
          case "FILE_CHUNK_DATA":
            handleFileChunkData(msg);
            break;

          // 步驟 3: 傳送端告知本輪結束，接收端比對並發送缺漏封包清單
          case "SENDER_TRANSFER_END":
            handleSenderTransferEnd(msg);
            break;

          // 傳送端收到接收端發送的缺漏清單，進行補發
          case "REQUEST_MISSING_CHUNKS":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.onMissingRequested) {
                task.onMissingRequested(msg.missingIndexes);
              }
            }
            break;

          // 步驟 5: 接收端傳送結束通知
          case "RECEIVER_TRANSFER_COMPLETE":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.onCompleteConfirmed) {
                task.onCompleteConfirmed();
              }
            }
            break;

          case "FILE_TRANSFER_CANCEL":
            handleFileTransferCancel(msg);
            break;

          case "HELLO":
            appendNotice(`${msg.name} 加入了大廳`);
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            sendData({ type: "WELCOME", name: myName, avatar: myAvatar });
            break;

          case "WELCOME":
          case "HEARTBEAT":
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            break;

          case "PLAYER_LEAVE":
            if (members.has(senderId)) {
              appendNotice(`${members.get(senderId).name} 離開了大廳`);
              members.delete(senderId);
              renderMemberList();
            }
            break;

          case "PING":
            if (msg.target === myId) sendData({ type: "PONG", target: senderId, time: msg.time });
            break;

          case "PONG":
            if (msg.target === myId) {
              const ping = Math.round(performance.now() - msg.time);
              document.getElementById("ping-stat").innerText = `${ping}ms`;
            }
            break;
        }
      }

      /* ============================================================
         3. 自訂精確傳輸協議實作 (依據指定步驟)
         ============================================================ */
      function handleFilesSelected(e) {
        const files = Array.from(e.target.files);
        if (!files || files.length === 0) return;

        totalBatchFiles += files.length;
        for (const file of files) {
          uploadQueue.push(file);
        }
        e.target.value = "";

        processUploadQueue();
      }

      function processUploadQueue() {
        if (!client || !client.connected) {
          alert("尚未連線至伺服器！");
          uploadQueue.length = 0;
          return;
        }

        const progBar = document.getElementById("transfer-progress-bar");
        progBar.classList.remove("hidden");
        progBar.classList.add("flex");

        // 一次處理一個檔案傳輸，以確保缺漏回傳與封包順序精確可靠
        if (activeUploads.size === 0 && uploadQueue.length > 0) {
          const file = uploadQueue.shift();
          startReliableTransfer(file).then(() => {
            completedBatchFiles++;
            updateOverallProgress();
            checkFinishedAll();
            processUploadQueue();
          });
        }
        updateOverallProgress();
      }

      function checkFinishedAll() {
        if (activeUploads.size === 0 && uploadQueue.length === 0) {
          const progText = document.getElementById("transfer-progress-text");
          progText.innerText = "所有檔案傳輸完成！";
          setTimeout(() => {
            if (uploadQueue.length === 0 && activeUploads.size === 0) {
              const progBar = document.getElementById("transfer-progress-bar");
              progBar.classList.add("hidden");
              progBar.classList.remove("flex");
              totalBatchFiles = 0;
              completedBatchFiles = 0;
            }
          }, 1500);
        }
      }

      function updateOverallProgress() {
        const progText = document.getElementById("transfer-progress-text");
        if (!progText) return;

        if (activeUploads.size > 0 || uploadQueue.length > 0) {
          let activeSummary = [];
          activeUploads.forEach((task) => {
            activeSummary.push(`${task.fileName} (${task.pct}%)`);
          });
          progText.innerText = `傳輸進度 [${completedBatchFiles}/${totalBatchFiles}] 等待: ${uploadQueue.length} | ${activeSummary.join(" | ")}`;
        }
      }

      function startReliableTransfer(file) {
        return new Promise(async (resolve) => {
          const isImage = file.type.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(file.name);
          const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
          const fileId = "f_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

          // 本地即時預覽
          const localBlobUrl = URL.createObjectURL(file);
          if (isImage) {
            appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "image", true, myId);
          } else {
            appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "file", true, myId);
          }

          let isResolved = false;
          const finishTask = () => {
            if (isResolved) return;
            isResolved = true;
            activeUploads.delete(fileId);
            resolve();
          };

          const task = {
            fileName: file.name,
            fileSize: file.size,
            pct: 0,
            file,
            totalChunks,
            isCancelled: false,
            sentChunks: new Set(),
            onMissingRequested: null,
            onCompleteConfirmed: null
          };
          activeUploads.set(fileId, task);

          // 步驟 1: 先傳送一個數字代表所有封包數 (totalChunks)
          sendData({
            type: "FILE_HEADER_START",
            fileId: fileId,
            totalChunks: totalChunks, // 傳送封包總數
            fileName: file.name,
            fileSize: file.size,
            fileType: file.type || "application/octet-stream",
            isImage: isImage,
            name: myName,
            avatar: myAvatar
          });

          // 步驟 2: 傳送封包（最前面帶有編號 index）
          async function sendBatch(indexesToSend) {
            for (const idx of indexesToSend) {
              if (task.isCancelled) return;

              const offset = idx * CHUNK_SIZE;
              const sliceBlob = file.slice(offset, Math.min(offset + CHUNK_SIZE, file.size));
              const base64Chunk = await readSliceAsBase64(sliceBlob);

              // 每個封包最前面都會跟著編號 (index)
              sendData({
                type: "FILE_CHUNK_DATA",
                fileId: fileId,
                index: idx, // 封包編號
                chunk: base64Chunk
              });

              task.sentChunks.add(idx);
              task.pct = Math.round((task.sentChunks.size / totalChunks) * 100);
              updateOverallProgress();

              // 短暫等待，維持 QoS 1 佇列最佳流通
              await new Promise(r => setTimeout(r, 4));
            }

            // 步驟 3: 傳送端傳送結束訊號
            if (!task.isCancelled) {
              sendData({
                type: "SENDER_TRANSFER_END",
                fileId: fileId
              });
            }
          }

          // 如果只有自己一個人在房間，不需等待對端核對缺漏
          if (members.size <= 1) {
            const initialList = Array.from({ length: totalChunks }, (_, i) => i);
            await sendBatch(initialList);
            task.pct = 100;
            updateOverallProgress();
            finishTask();
            return;
          }

          // 步驟 4: 等待接收端回傳缺漏封包，直到所有封包到齊
          let transferDone = false;

          task.onCompleteConfirmed = () => {
            // 接收端傳送結束
            transferDone = true;
            task.pct = 100;
            updateOverallProgress();
            finishTask();
          };

          task.onMissingRequested = async (missingIndexes) => {
            if (task.isCancelled || transferDone) return;
            if (missingIndexes && missingIndexes.length > 0) {
              // 重新發送缺漏封包
              await sendBatch(missingIndexes);
            }
          };

          // 首次將所有封包發出 (0 到 totalChunks - 1)
          const allIndexes = Array.from({ length: totalChunks }, (_, i) => i);
          await sendBatch(allIndexes);

          // 超時保護 (若無人響應最多等候 30 秒)
          setTimeout(() => {
            if (!transferDone) finishTask();
          }, 30000);
        });
      }

      function cancelActiveUpload() {
        uploadQueue.length = 0;
        totalBatchFiles = 0;
        completedBatchFiles = 0;
        activeUploads.forEach((task, fileId) => {
          task.isCancelled = true;
          sendData({ type: "FILE_TRANSFER_CANCEL", fileId: fileId });
        });
        activeUploads.clear();
        document.getElementById("transfer-progress-bar").classList.add("hidden");
        document.getElementById("transfer-progress-bar").classList.remove("flex");
        appendNotice("已取消所有傳輸任務。");
      }

      /* ============================================================
         接收端邏輯：記錄缺漏 -> 傳送端結束時發送缺漏 -> 到齊傳送結束
         ============================================================ */
      function handleFileHeaderStart(msg) {
        const { fileId, totalChunks, fileName, fileType, fileSize, isImage, name, avatar, senderId } = msg;
        const placeholderId = "box_" + fileId;

        // 初始化追蹤集合：missing 紀錄未收到的封包編號
        const missingSet = new Set();
        for (let i = 0; i < totalChunks; i++) {
          missingSet.add(i);
        }

        incomingFiles.set(fileId, {
          chunks: new Array(totalChunks),
          totalChunks: totalChunks, // 接收總封包數
          missing: missingSet,      // 紀錄沒收到的封包
          receivedBytes: 0,
          totalBytes: fileSize,
          fileName: fileName,
          fileType: fileType,
          isImage: isImage,
          name: name,
          avatar: avatar,
          senderId: senderId,
          placeholderId: placeholderId
        });

        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.id = placeholderId;
        row.className = "flex gap-3 max-w-[85%] self-start flex-row";
        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col items-start">
            <span class="text-xs font-medium text-slate-300 mb-1 px-1">${name}</span>
            <div class="p-3 rounded-xl bg-slate-800/90 border border-slate-700 flex items-center gap-2 text-xs text-sky-300">
              <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
              <span id="${placeholderId}_txt">正在接收檔案: 0 / ${totalChunks} 封包 (0%)</span>
            </div>
          </div>
        `;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function handleFileChunkData(msg) {
        const { fileId, index, chunk } = msg;
        const pack = incomingFiles.get(fileId);
        if (!pack) return;

        // 接收端記錄收到的封包，並從缺漏清單中剔除該編號
        if (!pack.chunks[index]) {
          const uint8 = base64ToUint8(chunk);
          pack.chunks[index] = uint8;
          pack.missing.delete(index); // 記錄已收到
          pack.receivedBytes += uint8.length;

          const txt = document.getElementById(pack.placeholderId + "_txt");
          if (txt) {
            const receivedCount = pack.totalChunks - pack.missing.size;
            const pct = Math.round((receivedCount / pack.totalChunks) * 100);
            txt.innerText = `正在接收檔案: ${receivedCount} / ${pack.totalChunks} 封包 (${pct}%)`;
          }
        }
      }

      function handleSenderTransferEnd(msg) {
        const pack = incomingFiles.get(msg.fileId);
        if (!pack) return;

        // 接收端檢查是否有缺漏的封包
        if (pack.missing.size > 0) {
          // 步驟 4: 接收端開始發送缺漏封包清單 (QoS 1)
          sendData({
            type: "REQUEST_MISSING_CHUNKS",
            targetId: pack.senderId,
            fileId: msg.fileId,
            missingIndexes: Array.from(pack.missing)
          });
        } else {
          // 步驟 5: 一直重複直到所有封包到齊 -> 接收端傳送結束通知 (QoS 1)
          sendData({
            type: "RECEIVER_TRANSFER_COMPLETE",
            targetId: pack.senderId,
            fileId: msg.fileId
          });

          // 組裝所有封包為完整檔案
          const fullBlob = new Blob(pack.chunks, { type: pack.fileType });
          const objectUrl = URL.createObjectURL(fullBlob);
          finalizeReceivedFile(pack, objectUrl);

          pack.chunks = null;
          incomingFiles.delete(msg.fileId);
        }
      }

      function handleFileTransferCancel(msg) {
        const pack = incomingFiles.get(msg.fileId);
        if (!pack) return;

        const el = document.getElementById(pack.placeholderId);
        if (el) {
          el.innerHTML = `<span class="text-xs text-red-400 my-1 px-3 py-1 bg-red-950/40 rounded-lg border border-red-500/30">傳輸已取消。</span>`;
        }
        pack.chunks = null;
        incomingFiles.delete(msg.fileId);
      }

      function finalizeReceivedFile(pack, objectUrl) {
        const row = document.getElementById(pack.placeholderId);
        if (!row) return;

        const contentDiv = row.querySelector(".flex-col");
        if (pack.isImage) {
          contentDiv.innerHTML = `
            <span class="text-xs font-medium text-slate-300 mb-1 px-1">${pack.name}</span>
            <div class="p-2 rounded-xl bg-slate-800/90 border border-slate-700 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${objectUrl}" class="max-w-full max-h-[260px] rounded-lg object-contain cursor-pointer hover:opacity-90" onclick="showBigImage('${objectUrl}')" />
              <div class="flex justify-between items-center pt-1 border-t border-slate-700/60">
                <span class="text-xs text-slate-300 truncate max-w-[140px]">${pack.fileName} (${formatBytes(pack.totalBytes)})</span>
                <a href="${objectUrl}" download="${pack.fileName}" class="px-2.5 py-1 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載</a>
              </div>
            </div>
          `;
        } else {
          contentDiv.innerHTML = `
            <span class="text-xs font-medium text-slate-300 mb-1 px-1">${pack.name}</span>
            <div class="p-3 rounded-xl bg-slate-800/90 border border-slate-700 flex flex-col gap-2 min-w-[220px] max-w-sm">
              <div class="flex items-center gap-2 font-medium text-white text-xs">
                <span class="text-base">📄</span>
                <span class="truncate">${pack.fileName}</span>
              </div>
              <div class="text-xs text-slate-400">檔案大小: ${formatBytes(pack.totalBytes)}</div>
              <div class="flex justify-end pt-1 border-t border-slate-700/60">
                <a href="${objectUrl}" download="${pack.fileName}" class="w-full text-center py-1.5 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載檔案</a>
              </div>
            </div>
          `;
        }
        document.getElementById("chat-scroller").scrollTop = document.getElementById("chat-scroller").scrollHeight;
      }

      /* ============================================================
         4. 聊天訊息與介面渲染
         ============================================================ */
      function sendTextMessage() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        appendChatMessage(myName, text, myAvatar, "text", true, myId);
        sendData({ type: "CHAT_TEXT", name: myName, avatar: myAvatar, text: text });
        input.value = "";
        input.focus();
      }

      function renderMemberList() {
        const container = document.getElementById("player-list");
        document.getElementById("online-count").innerText = members.size;
        container.innerHTML = "";

        members.forEach((user, id) => {
          const isMe = (id === myId);
          const shortId = id.slice(-3);
          const row = document.createElement("div");
          row.className = "flex items-center justify-between bg-slate-800/60 px-2.5 py-1.5 rounded-lg border border-slate-700/50 text-xs";
          row.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <img src="${user.avatar}" class="w-6 h-6 rounded-md object-cover border border-slate-600 flex-shrink-0" />
              <span class="truncate ${isMe ? 'text-sky-300 font-semibold' : 'text-slate-300'}">
                ${user.name} <span class="text-[10px] text-slate-500">#${shortId}</span> ${isMe ? '<span class="text-[10px] text-sky-400">(你)</span>' : ''}
              </span>
            </div>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 flex-shrink-0"></span>
          `;
          container.appendChild(row);
        });
      }

      function appendChatMessage(sender, data, avatar, type = "text", isMe = false, senderId = "") {
        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.className = `flex gap-2.5 max-w-[85%] ${isMe ? "self-end flex-row-reverse" : "self-start flex-row"}`;

        let innerContent = "";

        if (type === "text") {
          innerContent = `
            <div class="px-4 py-2.5 rounded-2xl text-sm break-words select-text ${
              isMe
                ? "bg-sky-600 text-white rounded-br-none shadow-md"
                : "bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700"
            }">${data}</div>
          `;
        } else if (type === "image") {
          const { url, fileName, fileSize } = data;
          innerContent = `
            <div class="p-2 rounded-xl bg-slate-800 border border-slate-700 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${url}" class="max-w-full max-h-[260px] rounded-lg object-contain cursor-pointer hover:opacity-95" onclick="showBigImage('${url}')" />
              <div class="flex justify-between items-center pt-1 border-t border-slate-700/60">
                <span class="text-xs text-slate-300 truncate max-w-[140px]">${fileName} (${formatBytes(fileSize)})</span>
                <a href="${url}" download="${fileName}" class="px-2 py-1 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載</a>
              </div>
            </div>
          `;
        } else if (type === "file") {
          const { fileName, url, fileSize } = data;
          innerContent = `
            <div class="p-3 rounded-xl bg-slate-800 border border-slate-700 flex flex-col gap-2 min-w-[200px] max-w-sm">
              <div class="flex items-center gap-2 font-medium text-white text-xs">
                <span class="text-base">📄</span>
                <span class="truncate">${fileName}</span>
              </div>
              <div class="text-xs text-slate-400">大小: ${formatBytes(fileSize)}</div>
              <div class="flex justify-end pt-1 border-t border-slate-700/60">
                <a href="${url}" download="${fileName}" class="w-full text-center py-1.5 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載檔案</a>
              </div>
            </div>
          `;
        }

        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col ${isMe ? "items-end" : "items-start"}">
            <span class="text-xs font-medium ${isMe ? "text-sky-300" : "text-slate-400"} mb-1 px-1">${sender}</span>
            ${innerContent}
          </div>
        `;

        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function appendNotice(text) {
        const box = document.getElementById("chat-scroller");
        const notice = document.createElement("div");
        notice.className = "text-xs text-slate-400 text-center my-1.5 bg-slate-800/60 py-1 px-3.5 rounded-full self-center border border-slate-700/50";
        notice.textContent = text;
        box.appendChild(notice);
        box.scrollTop = box.scrollHeight;
      }

      function showBigImage(src) {
        document.getElementById("image-modal-preview").src = src;
        document.getElementById("image-modal").classList.remove("hidden");
      }

      function startHeartbeat() {
        pingLoop = setInterval(() => {
          sendData({ type: "HEARTBEAT", name: myName, avatar: myAvatar });
          const otherIds = Array.from(members.keys()).filter(id => id !== myId);
          if (otherIds.length > 0) {
            const target = otherIds[Math.floor(Math.random() * otherIds.length)];
            sendData({ type: "PING", target: target, time: performance.now() });
          }
        }, 3000);

        checkLoop = setInterval(() => {
          const now = Date.now();
          let changed = false;
          members.forEach((user, id) => {
            if (id !== myId && now - user.lastSeen > 8000) {
              members.delete(id);
              changed = true;
            }
          });
          if (changed) renderMemberList();
        }, 2000);
      }

      function leaveLobby() {
        if (pingLoop) clearInterval(pingLoop);
        if (checkLoop) clearInterval(checkLoop);

        if (client) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
          client.end(true);
          client = null;
        }

        members.clear();
        uploadQueue.length = 0;
        document.getElementById("lobby-panel").classList.add("hidden");
        document.getElementById("login-panel").classList.remove("hidden");
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("conn-hint").innerText = "已離開大廳";
      }

      window.onload = () => {
        resetDefaultAvatar();
      };

      window.addEventListener("beforeunload", () => {
        if (client && client.connected) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
        }
      });
    </script>
  </body>
</html>

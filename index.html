<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公共大廳聊天室</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js 通訊庫 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #0b1120;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        user-select: none;
      }
      /* 俐落的深色科技質感 */
      .glass-panel {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      }
      .custom-btn {
        background: #0284c7;
        color: #ffffff;
        font-weight: 500;
        transition: all 0.15s ease;
      }
      .custom-btn:hover {
        background: #0369a1;
        box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
      }
      .custom-btn:active {
        transform: scale(0.98);
      }
      .input-box {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(51, 65, 85, 0.8);
        color: #f8fafc;
        transition: all 0.2s ease;
      }
      .input-box:focus {
        border-color: #38bdf8;
        outline: none;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body class="text-slate-100 flex items-center justify-center min-h-screen p-3 sm:p-5">

    <!-- 1. 登入面板 -->
    <div id="login-panel" class="relative z-10 w-full max-w-sm glass-panel rounded-2xl p-7 flex flex-col gap-5 backdrop-blur-md">
      <div class="text-center">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
          公共大廳聊天室
        </h1>
        <p class="text-xs text-slate-400 mt-1.5">即時線上交流空間</p>
      </div>

      <!-- 自訂頭像選取區 -->
      <div class="flex items-center gap-3.5 bg-slate-900/80 border border-slate-700/80 p-3 rounded-xl">
        <div class="relative group cursor-pointer w-14 h-14 rounded-xl bg-slate-800 border border-slate-600 overflow-hidden flex-shrink-0 flex items-center justify-center" onclick="document.getElementById('avatar-file').click()">
          <img id="avatar-preview" src="" class="w-full h-full object-cover hidden" />
          <span id="avatar-placeholder" class="text-xs text-slate-400">頭像</span>
          <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="text-[11px] text-sky-300 font-medium">更換</span>
          </div>
        </div>
        <input id="avatar-file" type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
        <div class="flex flex-col gap-1.5 flex-1">
          <div class="flex gap-2">
            <button type="button" onclick="document.getElementById('avatar-file').click()" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg transition-colors">
              上傳照片
            </button>
            <button type="button" onclick="resetDefaultAvatar()" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg transition-colors">
              隨機頭像
            </button>
          </div>
          <span class="text-[11px] text-slate-400">點擊頭像即可自訂圖片</span>
        </div>
      </div>

      <!-- 表單 -->
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">你的暱稱</label>
          <input id="input-username" type="text" maxlength="12" value="Player" placeholder="輸入你想使用的暱稱..."
            class="input-box w-full px-3.5 py-2.5 text-sm rounded-xl" />
        </div>

        <button onclick="joinLobby()" class="custom-btn py-3 rounded-xl text-sm font-semibold tracking-wide mt-1">
          進入公共大廳
        </button>

        <div id="conn-hint" class="text-xs text-center text-slate-400">
          準備就緒
        </div>
      </div>
    </div>

    <!-- 2. 主聊天大廳介面 -->
    <div id="lobby-panel" class="relative z-20 hidden w-[96vw] h-[94vh] max-w-6xl glass-panel rounded-2xl p-4 flex flex-col justify-between gap-3 backdrop-blur-md">
      
      <!-- 頂部資訊列 -->
      <div class="flex justify-between items-center pb-3 border-b border-slate-700/60 flex-shrink-0">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 bg-slate-900 border border-slate-700/80 px-3 py-1.5 rounded-lg">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-sm font-semibold text-white">公共大廳</span>
          </div>
          <span class="text-xs text-slate-300">
            線上成員：<span id="online-count" class="text-emerald-400 font-bold">1</span> 人
          </span>
        </div>

        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-400">延遲：<span id="ping-stat" class="text-emerald-400 font-medium">0ms</span></span>
          <button onclick="leaveLobby()" class="px-3 py-1.5 text-xs font-medium bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/40 rounded-lg transition-colors">
            離開大廳
          </button>
        </div>
      </div>

      <!-- 中央內容：聊天訊息 + 在線名單 -->
      <div class="flex-1 flex gap-3 overflow-hidden">
        <!-- 聊天捲軸區 -->
        <div class="flex-1 bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between overflow-hidden">
          <div id="chat-scroller" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 text-sm"></div>
        </div>

        <!-- 右側線上成員 -->
        <div class="w-60 bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col flex-shrink-0">
          <div class="text-xs font-semibold text-slate-300 mb-2.5 pb-2 border-b border-slate-700/60 flex justify-between items-center">
            <span>線上好友</span>
            <span class="text-emerald-400 text-[11px] font-normal">即時同步</span>
          </div>
          <div id="player-list" class="flex-1 overflow-y-auto flex flex-col gap-1.5"></div>
        </div>
      </div>

      <!-- 底部輸入與發送列 -->
      <div class="pt-1 flex flex-col gap-2 flex-shrink-0">
        <div class="flex items-center gap-2">
          <input id="file-upload-input" type="file" multiple class="hidden" onchange="handleFilesSelected(event)" />

          <button onclick="document.getElementById('file-upload-input').click()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600/80 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors">
            <span>📎 傳送檔案</span>
          </button>

          <!-- 傳輸進度狀態列 -->
          <div id="transfer-progress-bar" class="hidden items-center gap-2 bg-slate-900 border border-sky-500/40 px-3 py-1 rounded-lg text-xs text-sky-300">
            <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
            <span id="transfer-progress-text">準備傳輸中...</span>
            <button onclick="cancelActiveUpload()" class="ml-2 text-xs text-red-400 hover:text-red-300 underline font-medium">取消傳輸</button>
          </div>
        </div>

        <div class="flex gap-2">
          <input
            id="chat-input"
            type="text"
            maxlength="300"
            placeholder="說點什麼吧... (按 Enter 發送)"
            onkeydown="if(event.key === 'Enter') sendTextMessage();"
            class="input-box flex-1 px-4 py-2.5 rounded-xl text-sm"
          />
          <button onclick="sendTextMessage()" class="custom-btn px-6 py-2.5 rounded-xl text-sm font-semibold">
            發送
          </button>
        </div>
      </div>
    </div>

    <!-- 圖片點擊放大彈窗 -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center hidden p-4" onclick="this.classList.add('hidden')">
      <img id="image-modal-preview" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl border border-slate-700 shadow-2xl" />
    </div>

    <script>
      /* ============================================================
         1. 核心網路通訊與大廳狀態管理
         ============================================================ */
      const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
      const PUBLIC_TOPIC = "chat_lobby_public_v1/room_common";
      
      let myId = "";
      let client = null;
      let myName = "Player";
      let myAvatar = "";

      const members = new Map();
      let pingLoop = null;
      let checkLoop = null;

      // 4 通道流水線傳輸管理池
      const uploadQueue = [];
      let totalBatchFiles = 0;
      let completedBatchFiles = 0;
      const activeUploads = new Map();
      const incomingChunks = new Map();

      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      function makeDefaultAvatar(char = "P") {
        const colors = ["#0284c7", "#2563eb", "#7c3aed", "#059669", "#d97706"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="${color}"/>
          <text x="32" y="42" font-size="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">${char.slice(0, 1).toUpperCase()}</text>
        </svg>`;
        return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
      }

      function resetDefaultAvatar() {
        const name = document.getElementById("input-username").value.trim() || "P";
        myAvatar = makeDefaultAvatar(name);
        setAvatarImg(myAvatar);
      }

      function setAvatarImg(src) {
        const img = document.getElementById("avatar-preview");
        img.src = src;
        img.classList.remove("hidden");
        document.getElementById("avatar-placeholder").classList.add("hidden");
      }

      function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const cv = document.createElement("canvas");
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext("2d");
            const minSide = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - minSide) / 2, (img.height - minSide) / 2, minSide, minSide, 0, 0, 64, 64);
            myAvatar = cv.toDataURL("image/webp", 0.75);
            setAvatarImg(myAvatar);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function waitForReconnect() {
        return new Promise((resolve) => {
          const timer = setInterval(() => {
            if (client && client.connected) {
              clearInterval(timer);
              resolve();
            }
          }, 200);
        });
      }

      function joinLobby() {
        myId = "u_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

        const nameInput = document.getElementById("input-username").value.trim();
        myName = nameInput || "Player";
        if (!myAvatar) myAvatar = makeDefaultAvatar(myName);

        document.getElementById("conn-hint").innerText = "連線伺服器中...";

        client = mqtt.connect(BROKER_URL, {
          clientId: myId,
          clean: true,
          connectTimeout: 10000,
          reconnectPeriod: 2000,
          will: {
            topic: PUBLIC_TOPIC,
            payload: JSON.stringify({ type: "PLAYER_LEAVE", senderId: myId, name: myName }),
            qos: 0
          }
        });

        client.on("connect", () => {
          client.subscribe(PUBLIC_TOPIC, { qos: 0 }, (err) => {
            if (err) {
              alert("連線大廳失敗，請重新嘗試！");
              leaveLobby();
              return;
            }

            document.getElementById("login-panel").classList.add("hidden");
            document.getElementById("lobby-panel").classList.remove("hidden");

            members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
            renderMemberList();

            appendNotice(`歡迎來到公共大廳！`);

            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
            startHeartbeat();
          });
        });

        client.on("message", (topic, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.senderId === myId) return;
            handleMessage(msg);
          } catch (e) {}
        });

        client.on("error", () => {
          document.getElementById("conn-hint").innerText = "連線不穩定，正在自動重新連線...";
        });
      }

      function sendData(data) {
        if (!client || !client.connected) return false;
        data.senderId = myId;
        client.publish(PUBLIC_TOPIC, JSON.stringify(data), { qos: 0 });
        return true;
      }

      function handleMessage(msg) {
        const senderId = msg.senderId;
        if (!senderId) return;

        switch (msg.type) {
          case "CHAT_TEXT":
            appendChatMessage(msg.name, msg.text, msg.avatar, "text", false, senderId);
            break;

          case "CHUNK_TRANSFER_START":
            handleTransferStart(msg);
            break;

          case "CHUNK_DATA":
            handleChunkData(msg);
            break;

          case "CHUNK_TRANSFER_CANCEL":
            handleTransferCancel(msg);
            break;

          case "WINDOW_ACK":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.windowWaiters && task.windowWaiters.has(msg.windowIndex)) {
                task.windowWaiters.get(msg.windowIndex).onAck();
              }
            }
            break;

          case "WINDOW_NACK":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.windowWaiters && task.windowWaiters.has(msg.windowIndex)) {
                task.windowWaiters.get(msg.windowIndex).onNack(msg.missing);
              }
            }
            break;

          case "TRANSFER_CONFIRMED_SUCCESS":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.onConfirmed) task.onConfirmed();
            }
            break;

          case "HELLO":
            appendNotice(`${msg.name} 加入了大廳`);
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            sendData({ type: "WELCOME", name: myName, avatar: myAvatar });
            break;

          case "WELCOME":
          case "HEARTBEAT":
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            break;

          case "PLAYER_LEAVE":
            if (members.has(senderId)) {
              appendNotice(`${members.get(senderId).name} 離開了大廳`);
              members.delete(senderId);
              renderMemberList();
            }
            break;

          case "PING":
            if (msg.target === myId) sendData({ type: "PONG", target: senderId, time: msg.time });
            break;

          case "PONG":
            if (msg.target === myId) {
              const ping = Math.round(performance.now() - msg.time);
              document.getElementById("ping-stat").innerText = `${ping}ms`;
            }
            break;
        }
      }

      /* ============================================================
         2. 4 通道流水線 + 256KB 大封包高速傳輸引擎
         ============================================================ */
      const CHUNK_SIZE = 256 * 1024;
      const WINDOW_SIZE = 2;

      function readSliceAsBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const commaIndex = dataUrl.indexOf(",");
            resolve(commaIndex !== -1 ? dataUrl.substring(commaIndex + 1) : dataUrl);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function base64ToUint8(base64) {
        const binStr = atob(base64);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        return bytes;
      }

      function handleFilesSelected(e) {
        const files = Array.from(e.target.files);
        if (!files || files.length === 0) return;

        totalBatchFiles += files.length;
        for (const file of files) {
          uploadQueue.push(file);
        }
        e.target.value = "";

        processUploadPool();
      }

      function processUploadPool() {
        if (!client || !client.connected) {
          alert("尚未連上伺服器，請稍後再試！");
          uploadQueue.length = 0;
          return;
        }

        const progBar = document.getElementById("transfer-progress-bar");
        progBar.classList.remove("hidden");
        progBar.classList.add("flex");

        if (activeUploads.size === 0 && uploadQueue.length === 1) {
          const file = uploadQueue.shift();
          streamFileWithChannels(file, 4).then(() => {
            completedBatchFiles++;
            updateOverallProgress();
            checkFinishedAll();
          });
          updateOverallProgress();
          return;
        }

        while (activeUploads.size < 2 && uploadQueue.length > 0) {
          const file = uploadQueue.shift();
          streamFileWithChannels(file, 2).then(() => {
            completedBatchFiles++;
            updateOverallProgress();
            checkFinishedAll();
            processUploadPool();
          });
        }
        updateOverallProgress();
      }

      function checkFinishedAll() {
        if (activeUploads.size === 0 && uploadQueue.length === 0) {
          const progText = document.getElementById("transfer-progress-text");
          progText.innerText = "所有檔案傳輸完成！";
          setTimeout(() => {
            if (uploadQueue.length === 0 && activeUploads.size === 0) {
              const progBar = document.getElementById("transfer-progress-bar");
              progBar.classList.add("hidden");
              progBar.classList.remove("flex");
              totalBatchFiles = 0;
              completedBatchFiles = 0;
            }
          }, 1500);
        }
      }

      function updateOverallProgress() {
        const progText = document.getElementById("transfer-progress-text");
        if (!progText) return;

        if (activeUploads.size > 0 || uploadQueue.length > 0) {
          let activeSummary = [];
          activeUploads.forEach((task) => {
            activeSummary.push(`${task.fileName} (${task.pct}%)`);
          });
          progText.innerText = `傳輸進度 [${completedBatchFiles}/${totalBatchFiles}] 等待中: ${uploadQueue.length} | ${activeSummary.join(" | ")}`;
        }
      }

      function streamFileWithChannels(file, channels = 4) {
        return new Promise(async (resolve) => {
          const isImage = file.type.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(file.name);
          const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
          const totalWindows = Math.ceil(totalChunks / WINDOW_SIZE);
          const fileId = "f_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

          const localBlobUrl = URL.createObjectURL(file);
          if (isImage) {
            appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "image", true, myId);
          } else {
            appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "file", true, myId);
          }

          let isResolved = false;
          const finishThisFile = () => {
            if (isResolved) return;
            isResolved = true;
            activeUploads.delete(fileId);
            resolve();
          };

          const task = {
            fileName: file.name,
            channels: channels,
            pct: 0,
            file,
            totalChunks,
            totalWindows,
            isCancelled: false,
            sentChunks: new Set(),
            windowWaiters: new Map(),
            onConfirmed: null
          };
          activeUploads.set(fileId, task);

          sendData({
            type: "CHUNK_TRANSFER_START",
            fileId: fileId,
            totalChunks: totalChunks,
            totalWindows: totalWindows,
            fileName: file.name,
            fileType: file.type || "application/octet-stream",
            fileSize: file.size,
            isImage: isImage,
            name: myName,
            avatar: myAvatar
          });

          let nextWindowIdx = 0;

          async function channelWorker(workerId) {
            while (nextWindowIdx < totalWindows && !task.isCancelled) {
              const w = nextWindowIdx++;
              await sendSingleWindow(w);
            }
          }

          async function sendSingleWindow(w) {
            if (task.isCancelled) return;

            const startIdx = w * WINDOW_SIZE;
            const endIdx = Math.min(startIdx + WINDOW_SIZE, totalChunks);
            let windowConfirmed = false;
            let retryCount = 0;

            while (!windowConfirmed && retryCount < 8) {
              if (task.isCancelled) return;
              if (!client || !client.connected) await waitForReconnect();

              for (let i = startIdx; i < endIdx; i++) {
                const offset = i * CHUNK_SIZE;
                const sliceBlob = file.slice(offset, Math.min(offset + CHUNK_SIZE, file.size));
                const base64Chunk = await readSliceAsBase64(sliceBlob);

                const isWindowEnd = (i === endIdx - 1);
                sendData({
                  type: "CHUNK_DATA",
                  fileId: fileId,
                  index: i,
                  windowIndex: w,
                  isWindowEnd: isWindowEnd,
                  chunk: base64Chunk
                });

                task.sentChunks.add(i);
                await new Promise((r) => setTimeout(r, 3));
              }

              task.pct = Math.round((task.sentChunks.size / totalChunks) * 100);
              updateOverallProgress();

              if (members.size <= 1) {
                windowConfirmed = true;
                break;
              }

              const ackResult = await new Promise((ackResolve) => {
                const timer = setTimeout(() => {
                  task.windowWaiters.delete(w);
                  ackResolve({ status: "TIMEOUT" });
                }, 1400);

                task.windowWaiters.set(w, {
                  onAck: () => {
                    clearTimeout(timer);
                    task.windowWaiters.delete(w);
                    ackResolve({ status: "ACK" });
                  },
                  onNack: async (missing) => {
                    clearTimeout(timer);
                    task.windowWaiters.delete(w);
                    for (const mIdx of missing) {
                      const offset = mIdx * CHUNK_SIZE;
                      const sliceBlob = file.slice(offset, Math.min(offset + CHUNK_SIZE, file.size));
                      const base64Chunk = await readSliceAsBase64(sliceBlob);
                      sendData({
                        type: "CHUNK_DATA",
                        fileId: fileId,
                        index: mIdx,
                        windowIndex: w,
                        isWindowEnd: (mIdx === endIdx - 1),
                        chunk: base64Chunk
                      });
                      await new Promise((r) => setTimeout(r, 3));
                    }
                    ackResolve({ status: "RETRY" });
                  }
                });
              });

              if (ackResult.status === "ACK") {
                windowConfirmed = true;
              } else {
                retryCount++;
                await new Promise((r) => setTimeout(r, 40));
              }
            }
          }

          const activeWorkerPromises = [];
          const actualChannels = Math.min(channels, totalWindows);
          for (let c = 0; c < actualChannels; c++) {
            activeWorkerPromises.push(channelWorker(c));
          }

          await Promise.all(activeWorkerPromises);

          if (members.size > 1 && !task.isCancelled) {
            await new Promise((finalResolve) => {
              const timer = setTimeout(() => finalResolve(), 4000);
              task.onConfirmed = () => {
                clearTimeout(timer);
                finalResolve();
              };
            });
          }

          finishThisFile();
        });
      }

      function cancelActiveUpload() {
        uploadQueue.length = 0;
        totalBatchFiles = 0;
        completedBatchFiles = 0;
        activeUploads.forEach((task, fileId) => {
          task.isCancelled = true;
          sendData({ type: "CHUNK_TRANSFER_CANCEL", fileId: fileId });
        });
        activeUploads.clear();
        document.getElementById("transfer-progress-bar").classList.add("hidden");
        document.getElementById("transfer-progress-bar").classList.remove("flex");
        appendNotice("已取消傳輸任務。");
      }

      function handleTransferStart(msg) {
        const { fileId, totalChunks, totalWindows, fileName, fileType, fileSize, isImage, name, avatar, senderId } = msg;
        const placeholderId = "box_" + fileId;

        incomingChunks.set(fileId, {
          chunks: new Array(totalChunks),
          receivedCount: 0,
          totalChunks: totalChunks,
          totalWindows: totalWindows,
          fileName: fileName,
          fileType: fileType,
          fileSize: fileSize,
          isImage: isImage,
          name: name,
          avatar: avatar,
          senderId: senderId,
          placeholderId: placeholderId,
          receivedBytes: 0,
          totalBytes: fileSize
        });

        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.id = placeholderId;
        row.className = "flex gap-3 max-w-[85%] self-start flex-row";
        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col items-start">
            <span class="text-xs font-medium text-slate-300 mb-1 px-1">${name}</span>
            <div class="p-3 rounded-xl bg-slate-800/90 border border-slate-700 flex items-center gap-2 text-xs text-sky-300">
              <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
              <span id="${placeholderId}_txt">正在接收檔案: 0 B / ${formatBytes(fileSize)} (0%)</span>
            </div>
          </div>
        `;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function handleChunkData(msg) {
        const { fileId, index, windowIndex, isWindowEnd, chunk } = msg;
        const pack = incomingChunks.get(fileId);
        if (!pack) return;

        if (!pack.chunks[index]) {
          const uint8 = base64ToUint8(chunk);
          pack.chunks[index] = uint8;
          pack.receivedCount++;
          pack.receivedBytes += uint8.length;

          const txt = document.getElementById(pack.placeholderId + "_txt");
          if (txt) {
            const pct = Math.round((pack.receivedCount / pack.totalChunks) * 100);
            txt.innerText = `正在接收檔案: ${formatBytes(pack.receivedBytes)} / ${formatBytes(pack.totalBytes)} (${pct}%)`;
          }
        }

        if (isWindowEnd || index === pack.totalChunks - 1) {
          const startIdx = windowIndex * WINDOW_SIZE;
          const endIdx = Math.min(startIdx + WINDOW_SIZE, pack.totalChunks);
          const missing = [];

          for (let i = startIdx; i < endIdx; i++) {
            if (!pack.chunks[i]) missing.push(i);
          }

          if (missing.length === 0) {
            sendData({
              type: "WINDOW_ACK",
              targetId: pack.senderId,
              fileId: fileId,
              windowIndex: windowIndex
            });

            if (pack.receivedCount === pack.totalChunks) {
              const fullBlob = new Blob(pack.chunks, { type: pack.fileType });
              const objectUrl = URL.createObjectURL(fullBlob);

              finalizeReceivedFile(pack, objectUrl);

              sendData({
                type: "TRANSFER_CONFIRMED_SUCCESS",
                targetId: pack.senderId,
                fileId: fileId
              });

              pack.chunks = null;
              incomingChunks.delete(fileId);
            }
          } else {
            sendData({
              type: "WINDOW_NACK",
              targetId: pack.senderId,
              fileId: fileId,
              windowIndex: windowIndex,
              missing: missing
            });
          }
        }
      }

      function handleTransferCancel(msg) {
        const pack = incomingChunks.get(msg.fileId);
        if (!pack) return;

        const el = document.getElementById(pack.placeholderId);
        if (el) {
          el.innerHTML = `<span class="text-xs text-red-400 my-1 px-3 py-1 bg-red-950/40 rounded-lg border border-red-500/30">傳輸已取消。</span>`;
        }
        pack.chunks = null;
        incomingChunks.delete(msg.fileId);
      }

      function finalizeReceivedFile(pack, objectUrl) {
        const row = document.getElementById(pack.placeholderId);
        if (!row) return;

        const contentDiv = row.querySelector(".flex-col");
        if (pack.isImage) {
          contentDiv.innerHTML = `
            <span class="text-xs font-medium text-slate-300 mb-1 px-1">${pack.name}</span>
            <div class="p-2 rounded-xl bg-slate-800/90 border border-slate-700 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${objectUrl}" class="max-w-full max-h-[260px] rounded-lg object-contain cursor-pointer hover:opacity-90" onclick="showBigImage('${objectUrl}')" />
              <div class="flex justify-between items-center pt-1 border-t border-slate-700/60">
                <span class="text-xs text-slate-300 truncate max-w-[140px]">${pack.fileName} (${formatBytes(pack.totalBytes)})</span>
                <a href="${objectUrl}" download="${pack.fileName}" class="px-2.5 py-1 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載</a>
              </div>
            </div>
          `;
        } else {
          contentDiv.innerHTML = `
            <span class="text-xs font-medium text-slate-300 mb-1 px-1">${pack.name}</span>
            <div class="p-3 rounded-xl bg-slate-800/90 border border-slate-700 flex flex-col gap-2 min-w-[220px] max-w-sm">
              <div class="flex items-center gap-2 font-medium text-white text-xs">
                <span class="text-base">📄</span>
                <span class="truncate">${pack.fileName}</span>
              </div>
              <div class="text-xs text-slate-400">檔案大小: ${formatBytes(pack.totalBytes)}</div>
              <div class="flex justify-end pt-1 border-t border-slate-700/60">
                <a href="${objectUrl}" download="${pack.fileName}" class="w-full text-center py-1.5 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載檔案</a>
              </div>
            </div>
          `;
        }
        document.getElementById("chat-scroller").scrollTop = document.getElementById("chat-scroller").scrollHeight;
      }

      /* ============================================================
         3. 聊天訊息發送與畫面渲染
         ============================================================ */
      function sendTextMessage() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        appendChatMessage(myName, text, myAvatar, "text", true, myId);
        sendData({ type: "CHAT_TEXT", name: myName, avatar: myAvatar, text: text });
        input.value = "";
        input.focus();
      }

      function renderMemberList() {
        const container = document.getElementById("player-list");
        document.getElementById("online-count").innerText = members.size;
        container.innerHTML = "";

        members.forEach((user, id) => {
          const isMe = (id === myId);
          const shortId = id.slice(-3);
          const row = document.createElement("div");
          row.className = "flex items-center justify-between bg-slate-800/60 px-2.5 py-1.5 rounded-lg border border-slate-700/50 text-xs";
          row.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <img src="${user.avatar}" class="w-6 h-6 rounded-md object-cover border border-slate-600 flex-shrink-0" />
              <span class="truncate ${isMe ? 'text-sky-300 font-semibold' : 'text-slate-300'}">
                ${user.name} <span class="text-[10px] text-slate-500">#${shortId}</span> ${isMe ? '<span class="text-[10px] text-sky-400">(你)</span>' : ''}
              </span>
            </div>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 flex-shrink-0"></span>
          `;
          container.appendChild(row);
        });
      }

      function appendChatMessage(sender, data, avatar, type = "text", isMe = false, senderId = "") {
        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.className = `flex gap-2.5 max-w-[85%] ${isMe ? "self-end flex-row-reverse" : "self-start flex-row"}`;

        let innerContent = "";

        if (type === "text") {
          innerContent = `
            <div class="px-4 py-2.5 rounded-2xl text-sm break-words select-text ${
              isMe
                ? "bg-sky-600 text-white rounded-br-none shadow-md"
                : "bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700"
            }">${data}</div>
          `;
        } else if (type === "image") {
          const { url, fileName, fileSize } = data;
          innerContent = `
            <div class="p-2 rounded-xl bg-slate-800 border border-slate-700 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${url}" class="max-w-full max-h-[260px] rounded-lg object-contain cursor-pointer hover:opacity-95" onclick="showBigImage('${url}')" />
              <div class="flex justify-between items-center pt-1 border-t border-slate-700/60">
                <span class="text-xs text-slate-300 truncate max-w-[140px]">${fileName} (${formatBytes(fileSize)})</span>
                <a href="${url}" download="${fileName}" class="px-2 py-1 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載</a>
              </div>
            </div>
          `;
        } else if (type === "file") {
          const { fileName, url, fileSize } = data;
          innerContent = `
            <div class="p-3 rounded-xl bg-slate-800 border border-slate-700 flex flex-col gap-2 min-w-[200px] max-w-sm">
              <div class="flex items-center gap-2 font-medium text-white text-xs">
                <span class="text-base">📄</span>
                <span class="truncate">${fileName}</span>
              </div>
              <div class="text-xs text-slate-400">大小: ${formatBytes(fileSize)}</div>
              <div class="flex justify-end pt-1 border-t border-slate-700/60">
                <a href="${url}" download="${fileName}" class="w-full text-center py-1.5 text-xs bg-sky-600 hover:bg-sky-500 text-white rounded-md transition-colors">下載檔案</a>
              </div>
            </div>
          `;
        }

        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col ${isMe ? "items-end" : "items-start"}">
            <span class="text-xs font-medium ${isMe ? "text-sky-300" : "text-slate-400"} mb-1 px-1">${sender}</span>
            ${innerContent}
          </div>
        `;

        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function appendNotice(text) {
        const box = document.getElementById("chat-scroller");
        const notice = document.createElement("div");
        notice.className = "text-xs text-slate-400 text-center my-1.5 bg-slate-800/60 py-1 px-3.5 rounded-full self-center border border-slate-700/50";
        notice.textContent = text;
        box.appendChild(notice);
        box.scrollTop = box.scrollHeight;
      }

      function showBigImage(src) {
        document.getElementById("image-modal-preview").src = src;
        document.getElementById("image-modal").classList.remove("hidden");
      }

      function startHeartbeat() {
        pingLoop = setInterval(() => {
          sendData({ type: "HEARTBEAT", name: myName, avatar: myAvatar });
          const otherIds = Array.from(members.keys()).filter(id => id !== myId);
          if (otherIds.length > 0) {
            const target = otherIds[Math.floor(Math.random() * otherIds.length)];
            sendData({ type: "PING", target: target, time: performance.now() });
          }
        }, 3000);

        checkLoop = setInterval(() => {
          const now = Date.now();
          let changed = false;
          members.forEach((user, id) => {
            if (id !== myId && now - user.lastSeen > 8000) {
              members.delete(id);
              changed = true;
            }
          });
          if (changed) renderMemberList();
        }, 2000);
      }

      function leaveLobby() {
        if (pingLoop) clearInterval(pingLoop);
        if (checkLoop) clearInterval(checkLoop);

        if (client) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
          client.end(true);
          client = null;
        }

        members.clear();
        uploadQueue.length = 0;
        document.getElementById("lobby-panel").classList.add("hidden");
        document.getElementById("login-panel").classList.remove("hidden");
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("conn-hint").innerText = "已離開公共大廳";
      }

      window.onload = () => {
        resetDefaultAvatar();
      };

      window.addEventListener("beforeunload", () => {
        if (client && client.connected) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
        }
      });
    </script>
  </body>
</html>

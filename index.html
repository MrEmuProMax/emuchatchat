<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYBER COMM // 量子高速通訊網絡 (極速修復版)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js 通訊庫 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Google 科技風格字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <style>
      :root {
        --neon-cyan: #00f2fe;
        --neon-blue: #4facfe;
        --neon-purple: #9d4edd;
        --dark-bg: #070a13;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: var(--dark-bg);
        font-family: "Chakra Petch", sans-serif;
        user-select: none;
      }
      .font-mono-tech {
        font-family: "JetBrains Mono", monospace;
      }
      .tech-grid-bg {
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.08) 0%, transparent 80%),
          linear-gradient(to right, rgba(0, 242, 254, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
        background-size: 100% 100%, 32px 32px, 32px 32px;
      }
      .glow-border {
        border: 1px solid rgba(0, 242, 254, 0.35);
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.12), inset 0 0 10px rgba(0, 242, 254, 0.06);
      }
      .cyber-btn {
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.1) 100%);
        border: 1px solid rgba(0, 242, 254, 0.6);
        color: #00f2fe;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        text-shadow: 0 0 6px rgba(0, 242, 254, 0.6);
      }
      .cyber-btn:hover {
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.3) 0%, rgba(79, 172, 254, 0.25) 100%);
        border-color: #00f2fe;
        box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
        transform: translateY(-1px);
      }
      .cyber-btn:active {
        transform: translateY(1px);
        box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
      }
      .cyber-btn-primary {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #050b14;
        font-weight: 700;
        border: none;
        box-shadow: 0 0 18px rgba(0, 242, 254, 0.45);
      }
      .cyber-btn-primary:hover {
        background: linear-gradient(135deg, #38f9d7 0%, #43e97b 100%);
        box-shadow: 0 0 24px rgba(56, 249, 215, 0.65);
      }
      .cyber-input {
        background: rgba(10, 16, 28, 0.85);
        border: 1px solid rgba(0, 242, 254, 0.3);
        color: #ffffff;
        transition: all 0.2s ease;
      }
      .cyber-input:focus {
        border-color: #00f2fe;
        outline: none;
        box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 242, 254, 0.4);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(5, 10, 18, 0.6);
      }
    </style>
  </head>
  <body class="tech-grid-bg text-slate-100 flex items-center justify-center min-h-screen">

    <!-- 1. 科技登入終端 -->
    <div id="login-panel" class="relative z-10 w-full max-w-md bg-[#0a0f1d]/95 glow-border rounded-xl p-7 shadow-2xl backdrop-blur-xl flex flex-col gap-5">
      <div class="text-center relative">
        <div class="inline-block px-3 py-0.5 rounded-full text-[10px] uppercase tracking-widest font-mono-tech text-cyan-400 bg-cyan-950/60 border border-cyan-500/30 mb-2">
          High-Velocity Engine // v8.0 Turbo
        </div>
        <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400">
          CYBER COMM // LINK
        </h1>
        <p class="text-xs text-slate-400 font-mono-tech mt-1 tracking-wide">P2P 極速直連 + 8 通道流水線備援</p>
      </div>

      <!-- 自訂頭像選取區 -->
      <div class="flex items-center gap-3.5 bg-[#050811]/90 border border-cyan-500/30 p-3 rounded-lg">
        <div class="relative group cursor-pointer w-14 h-14 rounded-lg bg-slate-900 border border-cyan-400/50 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-[0_0_10px_rgba(0,242,254,0.15)]" onclick="document.getElementById('avatar-file').click()">
          <img id="avatar-preview" src="" class="w-full h-full object-cover hidden" />
          <span id="avatar-placeholder" class="text-[10px] text-cyan-400 font-mono-tech tracking-wider">AVATAR</span>
          <div class="absolute inset-0 bg-cyan-950/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="text-[10px] text-cyan-300 font-mono-tech font-bold">上傳</span>
          </div>
        </div>
        <input id="avatar-file" type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
        <div class="flex flex-col gap-1.5 flex-1">
          <div class="flex gap-2">
            <button type="button" onclick="document.getElementById('avatar-file').click()" class="cyber-btn px-2.5 py-1 text-[11px] rounded font-mono-tech">
              自訂外觀
            </button>
            <button type="button" onclick="resetDefaultAvatar()" class="cyber-btn px-2.5 py-1 text-[11px] rounded font-mono-tech">
              隨機矩陣
            </button>
          </div>
          <span class="text-[10px] text-slate-400 font-mono-tech">具備 Candidate 緩衝交握協議</span>
        </div>
      </div>

      <!-- 表單 -->
      <div class="flex flex-col gap-3.5">
        <div>
          <label class="block text-xs font-mono-tech text-cyan-400 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> 呼號 (CALLSIGN)
          </label>
          <input id="input-username" type="text" maxlength="14" value="Operator-7" placeholder="輸入通訊呼號..."
            class="cyber-input w-full px-3.5 py-2.5 text-sm rounded-lg font-mono-tech tracking-wide" />
        </div>

        <div>
          <label class="block text-xs font-mono-tech text-cyan-400 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-purple-400 animate-pulse"></span> 初始頻率 (CHANNEL)
          </label>
          <input id="input-room" type="text" maxlength="15" value="公共大廳" readonly
            class="cyber-input w-full px-3.5 py-2.5 text-sm rounded-lg font-mono-tech bg-slate-900/90 text-cyan-300 opacity-90 cursor-not-allowed border-dashed" />
          <span class="text-[10px] text-slate-500 font-mono-tech mt-1 block">※ 提示：請在兩個分頁登入相同頻率進行極速傳輸。</span>
        </div>

        <button onclick="joinLobby()" class="cyber-btn-primary py-3 rounded-lg text-sm tracking-wider font-bold uppercase transition-all duration-300 mt-2 flex items-center justify-center gap-2">
          <span>⚡ 初始化量子鏈接 (INITIALIZE LINK)</span>
        </button>

        <div id="conn-hint" class="font-mono-tech text-[11px] text-center text-slate-400 tracking-wider">
          STATUS: STANDBY
        </div>
      </div>
    </div>

    <!-- 2. 全屏科技大廳主工作站 -->
    <div id="lobby-panel" class="relative z-20 hidden w-[98vw] h-[95vh] max-w-7xl bg-[#080d19]/95 glow-border rounded-xl shadow-2xl backdrop-blur-2xl flex overflow-hidden">
      
      <!-- [左側欄] 大廳頻道切換與建立 -->
      <div class="w-64 bg-[#050811]/90 border-r border-cyan-500/20 flex flex-col justify-between flex-shrink-0">
        <div>
          <div class="p-3.5 border-b border-cyan-500/20 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-sm bg-cyan-400 shadow-[0_0_8px_#00f2fe]"></span>
              <span class="font-bold text-sm tracking-wider text-cyan-300 font-mono-tech">CYBER // CHANNELS</span>
            </div>
            <button onclick="promptCreateRoom()" title="建立全新大廳" class="cyber-btn w-6 h-6 rounded flex items-center justify-center text-xs font-bold font-mono-tech">
              ＋
            </button>
          </div>

          <div class="p-2">
            <div class="text-[10px] font-mono-tech text-slate-400 px-2 py-1.5 uppercase tracking-wider flex items-center justify-between">
              <span>網絡頻段節點</span>
              <span id="room-count-badge" class="text-cyan-400">4 活躍</span>
            </div>
            <div id="room-list" class="flex flex-col gap-1 mt-1 overflow-y-auto max-h-[calc(100vh-270px)] pr-1"></div>
          </div>
        </div>

        <!-- 底部個人小卡 -->
        <div class="p-3 border-t border-cyan-500/20 bg-slate-950/60 flex items-center justify-between">
          <div class="flex items-center gap-2.5 overflow-hidden">
            <img id="my-profile-avatar" src="" class="w-8 h-8 rounded-lg object-cover border border-cyan-400/50 flex-shrink-0" />
            <div class="flex flex-col overflow-hidden">
              <span id="my-profile-name" class="text-xs font-bold text-cyan-200 font-mono-tech truncate">Operator</span>
              <span class="text-[9px] text-green-400 font-mono-tech flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-ping"></span> 核心在線
              </span>
            </div>
          </div>
          <button onclick="leaveLobby()" title="斷開終端鏈接" class="cyber-btn p-1.5 rounded text-red-400 border-red-500/40 hover:border-red-400 hover:text-red-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </div>

      <!-- [中央與右側] 主聊天與成員區塊 -->
      <div class="flex-1 flex flex-col justify-between overflow-hidden">
        
        <!-- 頂部資訊列 -->
        <div class="px-4 py-2.5 border-b border-cyan-500/20 bg-slate-900/40 flex justify-between items-center flex-shrink-0">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-[#050811] border border-cyan-500/40 px-3 py-1 rounded-md">
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
              <span id="lobby-title" class="font-mono-tech text-xs font-bold text-cyan-300 tracking-wider">CH: 公共大廳</span>
            </div>
            <div class="hidden sm:flex items-center gap-2 text-xs font-mono-tech">
              <span id="p2p-badge" class="px-2.5 py-0.5 rounded bg-amber-950/60 text-amber-300 border border-amber-500/40 text-[10px] font-bold">
                ⏳ 正在探測通道...
              </span>
              <span class="text-slate-400">在線成員: <span id="online-count" class="text-green-400 font-bold">1</span> 單位</span>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <span class="font-mono-tech text-[10px] text-slate-400">PING: <span id="ping-stat" class="text-green-400 font-bold">0ms</span></span>
          </div>
        </div>

        <!-- 主體內容：聊天串 + 在線成員名單 -->
        <div class="flex-1 flex overflow-hidden p-3 gap-3">
          <div class="flex-1 bg-[#050811]/70 border border-cyan-500/20 rounded-lg p-3 flex flex-col justify-between overflow-hidden">
            <div id="chat-scroller" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 text-sm"></div>
          </div>

          <div class="w-56 bg-[#050811]/70 border border-cyan-500/20 rounded-lg p-3 flex flex-col flex-shrink-0">
            <div class="font-mono-tech text-[11px] text-cyan-400 mb-2 pb-1.5 border-b border-cyan-500/20 flex justify-between items-center tracking-wider">
              <span>ACTIVE AGENTS</span>
              <span class="text-green-400 text-[9px] flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> SYNC
              </span>
            </div>
            <div id="player-list" class="flex-1 overflow-y-auto flex flex-col gap-1.5"></div>
          </div>
        </div>

        <!-- 底部通訊工具列 -->
        <div class="p-3 border-t border-cyan-500/20 bg-slate-950/60 flex flex-col gap-2 flex-shrink-0">
          <div class="flex items-center gap-2">
            <input id="file-upload-input" type="file" multiple class="hidden" onchange="handleFilesSelected(event)" />

            <button onclick="document.getElementById('file-upload-input').click()" class="cyber-btn px-3 py-1.5 rounded text-xs font-mono-tech flex items-center gap-1.5">
              <span>⚡ 注入超大檔案 (極速直連)</span>
            </button>

            <!-- 傳輸進度狀態列 -->
            <div id="transfer-progress-bar" class="hidden items-center gap-2 bg-[#050811] border border-cyan-500/40 px-3 py-1.5 rounded text-xs font-mono-tech text-cyan-300">
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
              <span id="transfer-progress-text">準備傳輸中...</span>
              <button onclick="cancelActiveUpload()" class="ml-2 text-xs text-red-400 hover:text-red-300 underline font-bold">中斷任務</button>
            </div>
          </div>

          <div class="flex gap-2">
            <input
              id="chat-input"
              type="text"
              maxlength="300"
              placeholder="輸入加密訊息... (Enter 發送)"
              onkeydown="if(event.key === 'Enter') sendTextMessage();"
              class="cyber-input flex-1 px-4 py-2 rounded-lg text-sm font-mono-tech tracking-wide"
            />
            <button onclick="sendTextMessage()" class="cyber-btn-primary px-6 py-2 rounded-lg text-xs font-mono-tech font-bold tracking-wider">
              發送 (SEND)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 圖片放大預覽視窗 -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center hidden p-4" onclick="this.classList.add('hidden')">
      <img id="image-modal-preview" src="" class="max-w-full max-h-[90vh] object-contain rounded-lg border border-cyan-400/60 shadow-[0_0_30px_rgba(0,242,254,0.3)]" />
    </div>

    <script>
      /* ============================================================
         1. 網絡配置：Cloudflare/Google 高速 STUN + OpenRelay TURN
         ============================================================ */
      const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
      const LOBBY_PREFIX = "cyber_turbo_mesh_v8/";

      const RTC_CONFIG = {
        iceServers: [
          { urls: "stun:stun.cloudflare.com:3478" },
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          {
            urls: "turn:openrelay.metered.ca:80",
            username: "openrelayproject",
            credential: "openrelayproject"
          },
          {
            urls: "turn:openrelay.metered.ca:443",
            username: "openrelayproject",
            credential: "openrelayproject"
          }
        ]
      };

      let myId = "";
      let client = null;
      let myName = "Operator";
      let myAvatar = "";

      const availableRooms = ["公共大廳", "量子核心", "暗網終端", "戰術指揮中心"];
      let currentRoom = "公共大廳";
      let currentTopic = "";

      const members = new Map();
      let pingLoop = null;
      let checkLoop = null;

      // WebRTC 節點與候選緩衝器
      const rtcPeers = new Map(); // peerId -> { pc, dc, ready: bool, candidateQueue: [], remoteSet: bool }
      const uploadQueue = [];
      let activeUploadTask = null;
      const incomingFiles = new Map();

      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      function makeDefaultAvatar(char = "O") {
        const colors = ["#00f2fe", "#4facfe", "#9d4edd", "#05d5b3", "#ff007f"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <rect width="64" height="64" fill="#080e1b"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="6 3"/>
          <circle cx="32" cy="32" r="20" fill="none" stroke="${color}" stroke-opacity="0.3" stroke-width="1.5"/>
          <text x="32" y="40" font-size="22" font-family="'JetBrains Mono', monospace" font-weight="700" fill="${color}" text-anchor="middle">${char.slice(0, 1).toUpperCase()}</text>
        </svg>`;
        return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
      }

      function resetDefaultAvatar() {
        const name = document.getElementById("input-username").value.trim() || "O";
        myAvatar = makeDefaultAvatar(name);
        setAvatarImg(myAvatar);
      }

      function setAvatarImg(src) {
        const img = document.getElementById("avatar-preview");
        img.src = src;
        img.classList.remove("hidden");
        document.getElementById("avatar-placeholder").classList.add("hidden");
      }

      function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const cv = document.createElement("canvas");
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext("2d");
            const minSide = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - minSide) / 2, (img.height - minSide) / 2, minSide, minSide, 0, 0, 64, 64);
            myAvatar = cv.toDataURL("image/webp", 0.75);
            setAvatarImg(myAvatar);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getSafeTopic(roomName) {
        let hash = 0;
        for (let i = 0; i < roomName.length; i++) hash = ((hash << 5) - hash) + roomName.charCodeAt(i);
        return "room_" + Math.abs(hash);
      }

      function renderRoomList() {
        const container = document.getElementById("room-list");
        container.innerHTML = "";
        document.getElementById("room-count-badge").innerText = `${availableRooms.length} 活躍`;

        availableRooms.forEach(room => {
          const isActive = (room === currentRoom);
          const btn = document.createElement("button");
          btn.onclick = () => switchRoom(room);
          btn.className = `w-full text-left px-3 py-2 rounded-lg font-mono-tech text-xs transition-all flex items-center justify-between ${
            isActive
              ? "bg-cyan-950/60 border border-cyan-400/70 text-cyan-300 shadow-[0_0_12px_rgba(0,242,254,0.2)] font-bold"
              : "text-slate-400 hover:bg-slate-900/60 hover:text-slate-200 border border-transparent"
          }`;
          btn.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span class="text-[10px] ${isActive ? 'text-cyan-400' : 'text-slate-600'}">#</span>
              <span class="truncate">${room}</span>
            </div>
            ${isActive ? '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_6px_#00f2fe] flex-shrink-0"></span>' : ''}
          `;
          container.appendChild(btn);
        });
      }

      function promptCreateRoom() {
        const name = prompt("請輸入欲創建的量子大廳名稱 (1~15字):", "");
        if (!name) return;
        const cleanName = name.trim();
        if (!cleanName) return;

        if (!availableRooms.includes(cleanName)) {
          availableRooms.push(cleanName);
        }
        switchRoom(cleanName);
      }

      function closeAllPeers() {
        rtcPeers.forEach(peer => {
          try {
            if (peer.dc) peer.dc.close();
            if (peer.pc) peer.pc.close();
          } catch (e) {}
        });
        rtcPeers.clear();
        updateP2PBadge();
      }

      function switchRoom(newRoom) {
        if (!client || !client.connected) return;
        if (currentRoom === newRoom) return;

        closeAllPeers();
        sendData({ type: "PLAYER_LEAVE", name: myName });
        client.unsubscribe(currentTopic);

        currentRoom = newRoom;
        currentTopic = LOBBY_PREFIX + getSafeTopic(currentRoom);

        members.clear();
        members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("lobby-title").innerText = `CH: ${currentRoom}`;
        renderMemberList();
        renderRoomList();

        appendNotice(`// 節點重導向完畢：已連入量子頻道 [${currentRoom}]`);

        client.subscribe(currentTopic, { qos: 0 }, (err) => {
          if (!err) {
            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
          }
        });
      }

      function joinLobby() {
        myId = "op_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

        const nameInput = document.getElementById("input-username").value.trim();
        myName = nameInput || "Operator-7";
        if (!myAvatar) myAvatar = makeDefaultAvatar(myName);

        currentRoom = "公共大廳";
        currentTopic = LOBBY_PREFIX + getSafeTopic(currentRoom);

        document.getElementById("conn-hint").innerText = "CONNECTING TO NETWORK...";

        client = mqtt.connect(BROKER_URL, {
          clientId: myId,
          clean: true,
          connectTimeout: 10000,
          reconnectPeriod: 2500,
          will: {
            topic: currentTopic,
            payload: JSON.stringify({ type: "PLAYER_LEAVE", senderId: myId, name: myName }),
            qos: 0
          }
        });

        client.on("connect", () => {
          client.subscribe(currentTopic, { qos: 0 }, (err) => {
            if (err) {
              alert("量子節點鏈接失敗！");
              leaveLobby();
              return;
            }

            document.getElementById("login-panel").classList.add("hidden");
            document.getElementById("lobby-panel").classList.remove("hidden");
            document.getElementById("lobby-title").innerText = `CH: ${currentRoom}`;
            document.getElementById("my-profile-name").innerText = myName;
            document.getElementById("my-profile-avatar").src = myAvatar;

            renderRoomList();
            members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
            renderMemberList();

            appendNotice(`// 量子鏈接成功建立：接入頻率 [${currentRoom}]`);

            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
            startHeartbeat();
          });
        });

        client.on("message", (topic, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.senderId === myId) return;
            handleMessage(msg);
          } catch (e) {}
        });

        client.on("error", () => {
          document.getElementById("conn-hint").innerText = "SIGNAL UNSTABLE: RECONNECTING...";
        });
      }

      function sendData(data) {
        if (!client || !client.connected) return false;
        data.senderId = myId;
        client.publish(currentTopic, JSON.stringify(data), { qos: 0 });
        return true;
      }

      /* ============================================================
         2. ⚡ WebRTC P2P 高速交握核心 (帶 Candidate 緩衝隊列)
         ============================================================ */
      function getOrCreatePeer(targetId) {
        if (rtcPeers.has(targetId)) return rtcPeers.get(targetId);

        const pc = new RTCPeerConnection(RTC_CONFIG);
        const peer = {
          pc,
          dc: null,
          ready: false,
          candidateQueue: [],
          remoteSet: false
        };
        rtcPeers.set(targetId, peer);

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            sendData({
              type: "RTC_CANDIDATE",
              targetId: targetId,
              candidate: event.candidate
            });
          }
        };

        pc.ondatachannel = (event) => {
          setupDataChannel(targetId, event.channel);
        };

        return peer;
      }

      function startP2POffer(targetId) {
        if (myId >= targetId) return; // 避免兩端同時發起 Offer

        const peer = getOrCreatePeer(targetId);
        if (peer.ready) return;

        const dc = peer.pc.createDataChannel("cyber_p2p_channel", { ordered: true });
        setupDataChannel(targetId, dc);

        peer.pc.createOffer().then(offer => {
          return peer.pc.setLocalDescription(offer);
        }).then(() => {
          sendData({
            type: "RTC_OFFER",
            targetId: targetId,
            offer: peer.pc.localDescription
          });
        }).catch(console.error);
      }

      function setupDataChannel(targetId, dc) {
        dc.binaryType = "arraybuffer";
        const peer = getOrCreatePeer(targetId);
        peer.dc = dc;

        dc.onopen = () => {
          peer.ready = true;
          updateP2PBadge();
          const targetName = members.get(targetId)?.name || targetId;
          appendNotice(`// ⚡ [P2P 極速直連通道已貫通] 與特工 [${targetName}] 達成直連！`);
        };

        dc.onclose = () => {
          peer.ready = false;
          updateP2PBadge();
        };

        dc.onmessage = (event) => {
          handleDataChannelMessage(event.data, targetId);
        };
      }

      function updateP2PBadge() {
        let readyCount = 0;
        rtcPeers.forEach(p => { if (p.ready && p.dc && p.dc.readyState === "open") readyCount++; });
        const badge = document.getElementById("p2p-badge");
        if (!badge) return;

        if (readyCount > 0) {
          badge.className = "px-2.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/50 text-[10px] font-bold";
          badge.innerText = `⚡ P2P 極速直連: ${readyCount} 節點 (30~80MB/s)`;
        } else {
          badge.className = "px-2.5 py-0.5 rounded bg-amber-950/60 text-amber-300 border border-amber-500/40 text-[10px]";
          badge.innerText = `⏳ P2P 隧道協商中 (MQTT 備援就緒)`;
        }
      }

      async function handleMessage(msg) {
        const senderId = msg.senderId;
        if (!senderId) return;

        switch (msg.type) {
          case "CHAT_TEXT":
            appendChatMessage(msg.name, msg.text, msg.avatar, "text", false, senderId);
            break;

          // --- WebRTC 信令 (嚴格保證候選順序，不再丟棄候選) ---
          case "RTC_OFFER":
            if (msg.targetId === myId) {
              const peer = getOrCreatePeer(senderId);
              await peer.pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
              peer.remoteSet = true;

              // 釋放之前先收到的候選地址
              while (peer.candidateQueue.length > 0) {
                const cand = peer.candidateQueue.shift();
                try { await peer.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch(e){}
              }

              const answer = await peer.pc.createAnswer();
              await peer.pc.setLocalDescription(answer);
              sendData({ type: "RTC_ANSWER", targetId: senderId, answer: peer.pc.localDescription });
            }
            break;

          case "RTC_ANSWER":
            if (msg.targetId === myId && rtcPeers.has(senderId)) {
              const peer = rtcPeers.get(senderId);
              await peer.pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
              peer.remoteSet = true;

              // 釋放候選緩衝隊列
              while (peer.candidateQueue.length > 0) {
                const cand = peer.candidateQueue.shift();
                try { await peer.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch(e){}
              }
            }
            break;

          case "RTC_CANDIDATE":
            if (msg.targetId === myId) {
              const peer = getOrCreatePeer(senderId);
              if (!peer.remoteSet) {
                // Remote 尚未就緒時存入隊列，嚴禁拋棄
                peer.candidateQueue.push(msg.candidate);
              } else {
                try {
                  await peer.pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                } catch(e){}
              }
            }
            break;

          // --- MQTT 8 通道流水線中繼消息 ---
          case "MQTT_FILE_START":
            handleMqttFileStart(msg);
            break;

          case "MQTT_CHUNK_DATA":
            handleMqttChunkData(msg);
            break;

          case "MQTT_WINDOW_ACK":
            if (msg.targetId === myId && activeUploadTask && activeUploadTask.onWindowAck) {
              activeUploadTask.onWindowAck(msg.windowIndex);
            }
            break;

          case "TRANSFER_CONFIRMED":
            if (msg.targetId === myId && activeUploadTask && activeUploadTask.fileId === msg.fileId) {
              activeUploadTask.onPeerCompleted();
            }
            break;

          case "HELLO":
            appendNotice(`// 特工 [${msg.name}] 已接入頻道。`);
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            sendData({ type: "WELCOME", name: myName, avatar: myAvatar });
            startP2POffer(senderId);
            break;

          case "WELCOME":
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            startP2POffer(senderId);
            break;

          case "HEARTBEAT":
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            break;

          case "PLAYER_LEAVE":
            if (members.has(senderId)) {
              appendNotice(`// 特工 [${members.get(senderId).name}] 已離線。`);
              members.delete(senderId);
              if (rtcPeers.has(senderId)) {
                try {
                  rtcPeers.get(senderId).dc?.close();
                  rtcPeers.get(senderId).pc?.close();
                } catch(e){}
                rtcPeers.delete(senderId);
                updateP2PBadge();
              }
              renderMemberList();
            }
            break;

          case "PING":
            if (msg.target === myId) sendData({ type: "PONG", target: senderId, time: msg.time });
            break;

          case "PONG":
            if (msg.target === myId) {
              const ping = Math.round(performance.now() - msg.time);
              document.getElementById("ping-stat").innerText = `${ping}ms`;
            }
            break;
        }
      }

      /* ============================================================
         3. 🚀 傳輸調度核心：P2P 極速直連 (優先) ＋ MQTT 8通道流水線 (備援)
         ============================================================ */
      const P2P_CHUNK_SIZE = 32 * 1024;  // P2P: 32KB 原生 ArrayBuffer 二進制
      const MQTT_CHUNK_SIZE = 24 * 1024; // MQTT: 24KB 切片
      const MQTT_WINDOW_SIZE = 8;        // MQTT: 8 封包流水線批發 (每批192KB，告別單片傻等)

      function handleFilesSelected(e) {
        const files = Array.from(e.target.files);
        if (!files || files.length === 0) return;

        const otherAgents = Array.from(members.keys()).filter(id => id !== myId);
        if (otherAgents.length === 0) {
          alert(`⚠️ 無法傳輸：頻率【${currentRoom}】目前只有你一人！\n請打開另一個分頁進入相同頻道測試。`);
          e.target.value = "";
          return;
        }

        for (const file of files) {
          uploadQueue.push(file);
        }
        e.target.value = "";

        processUploadQueue();
      }

      async function processUploadQueue() {
        if (activeUploadTask || uploadQueue.length === 0) return;

        const file = uploadQueue.shift();
        const progBar = document.getElementById("transfer-progress-bar");
        progBar.classList.remove("hidden");
        progBar.classList.add("flex");

        // 檢查 P2P 隧道，若未就緒等待 2.5 秒打洞
        let p2pChannel = getReadyP2PChannel();
        if (!p2pChannel) {
          updateProgressText(file.name, 0, file.size, "等待 P2P 直連打洞 (約 2 秒)...");
          for (let i = 0; i < 5; i++) {
            await new Promise(r => setTimeout(r, 500));
            p2pChannel = getReadyP2PChannel();
            if (p2pChannel) break;
          }
        }

        if (p2pChannel) {
          await streamFileP2P(file);
        } else {
          appendNotice("// ⚠️ 跨網打洞受防火牆限制，已啟用【MQTT 8通道流水線中繼】！");
          await streamFileMqttPipelined(file);
        }

        activeUploadTask = null;

        if (uploadQueue.length > 0) {
          processUploadQueue();
        } else {
          const progText = document.getElementById("transfer-progress-text");
          progText.innerText = "⚡ 任務全部完成：檔案已 100% 抵達對端並校驗！";
          setTimeout(() => {
            if (!activeUploadTask && uploadQueue.length === 0) {
              progBar.classList.add("hidden");
              progBar.classList.remove("flex");
            }
          }, 2500);
        }
      }

      function getReadyP2PChannel() {
        for (const [id, peer] of rtcPeers.entries()) {
          if (peer.ready && peer.dc && peer.dc.readyState === "open") {
            return peer.dc;
          }
        }
        return null;
      }

      // --- [極速引擎] P2P / TURN 直連 (滿速 30MB/s ~ 80MB/s) ---
      function streamFileP2P(file) {
        return new Promise(async (resolve) => {
          const isImage = file.type.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(file.name);
          const totalChunks = Math.ceil(file.size / P2P_CHUNK_SIZE);
          const fileId = "pf_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 6);

          showLocalPreview(file, isImage);

          let isCancelled = false;
          let resolveFinal = null;

          activeUploadTask = {
            fileId,
            cancel: () => { isCancelled = true; },
            onPeerCompleted: () => { if (resolveFinal) resolveFinal(); }
          };

          const activeChannels = [];
          rtcPeers.forEach(peer => {
            if (peer.ready && peer.dc && peer.dc.readyState === "open") activeChannels.push(peer.dc);
          });

          // 發送元資料
          const metaPayload = JSON.stringify({
            cmd: "FILE_START",
            mode: "P2P",
            fileId: fileId,
            fileName: file.name,
            fileType: file.type || "application/octet-stream",
            fileSize: file.size,
            totalChunks: totalChunks,
            isImage: isImage,
            senderName: myName,
            senderAvatar: myAvatar
          });

          activeChannels.forEach(dc => dc.send(metaPayload));

          let bytesSent = 0;
          let startTime = Date.now();

          for (let i = 0; i < totalChunks; i++) {
            if (isCancelled) break;

            const offset = i * P2P_CHUNK_SIZE;
            const sliceBlob = file.slice(offset, Math.min(offset + P2P_CHUNK_SIZE, file.size));
            const arrayBuffer = await sliceBlob.arrayBuffer();

            const packet = new Uint8Array(8 + arrayBuffer.byteLength);
            const view = new DataView(packet.buffer);
            view.setUint32(0, i);
            view.setUint32(4, totalChunks);
            packet.set(new Uint8Array(arrayBuffer), 8);

            for (const dc of activeChannels) {
              while (dc.bufferedAmount > 4 * 1024 * 1024) {
                await new Promise(r => setTimeout(r, 4));
              }
              dc.send(packet.buffer);
            }

            bytesSent += sliceBlob.size;

            if (i % 16 === 0 || i === totalChunks - 1) {
              const elapsedSec = (Date.now() - startTime) / 1000;
              const speed = elapsedSec > 0 ? formatBytes(bytesSent / elapsedSec) + "/s" : "0 B/s";
              const pct = Math.min(100, Math.round((bytesSent / file.size) * 100));
              updateProgressText(file.name, bytesSent, file.size, `⚡ P2P直連 [${speed}] ${pct}%`);
            }
          }

          if (!isCancelled) {
            updateProgressText(file.name, bytesSent, file.size, "等待對端完成組裝校驗...");
            await Promise.race([
              new Promise(res => { resolveFinal = res; }),
              new Promise(res => setTimeout(res, 6000))
            ]);
          }

          resolve();
        });
      }

      // --- [備援引擎] MQTT 8 通道流水線滑動視窗 (1 MB/s ~ 2.5 MB/s，不再卡死 26KB) ---
      function streamFileMqttPipelined(file) {
        return new Promise(async (resolve) => {
          const isImage = file.type.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(file.name);
          const totalChunks = Math.ceil(file.size / MQTT_CHUNK_SIZE);
          const totalWindows = Math.ceil(totalChunks / MQTT_WINDOW_SIZE);
          const fileId = "mf_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 6);

          showLocalPreview(file, isImage);

          let isCancelled = false;
          let resolveFinal = null;
          let winAckResolver = null;

          activeUploadTask = {
            fileId,
            cancel: () => { isCancelled = true; },
            onWindowAck: (wIdx) => { if (winAckResolver) winAckResolver(wIdx); },
            onPeerCompleted: () => { if (resolveFinal) resolveFinal(); }
          };

          sendData({
            type: "MQTT_FILE_START",
            fileId: fileId,
            fileName: file.name,
            fileType: file.type || "application/octet-stream",
            fileSize: file.size,
            totalChunks: totalChunks,
            totalWindows: totalWindows,
            isImage: isImage,
            name: myName,
            avatar: myAvatar
          });

          let bytesSent = 0;
          let startTime = Date.now();

          for (let w = 0; w < totalWindows; w++) {
            if (isCancelled) break;

            const startIdx = w * MQTT_WINDOW_SIZE;
            const endIdx = Math.min(startIdx + MQTT_WINDOW_SIZE, totalChunks);

            // 批次並行注入視窗切片 (不再一片一等)
            for (let i = startIdx; i < endIdx; i++) {
              if (isCancelled) break;
              const offset = i * MQTT_CHUNK_SIZE;
              const sliceBlob = file.slice(offset, Math.min(offset + MQTT_CHUNK_SIZE, file.size));
              const base64Chunk = await readBlobAsBase64(sliceBlob);

              sendData({
                type: "MQTT_CHUNK_DATA",
                fileId: fileId,
                index: i,
                windowIndex: w,
                isWindowEnd: (i === endIdx - 1),
                chunk: base64Chunk
              });

              bytesSent += sliceBlob.size;
              await new Promise(r => setTimeout(r, 4)); // 4ms 微間隔防止 Broker 阻斷
            }

            // 等待該批次 8 切片視窗確認 (以整批確認替代單片確認)
            let winConfirmed = false;
            let retry = 0;
            while (!winConfirmed && retry < 5 && !isCancelled) {
              const res = await Promise.race([
                new Promise(r => { winAckResolver = r; }),
                new Promise(r => setTimeout(() => r("TIMEOUT"), 1500))
              ]);

              if (res === w) {
                winConfirmed = true;
              } else {
                retry++;
                // 重送該視窗
                for (let i = startIdx; i < endIdx; i++) {
                  const offset = i * MQTT_CHUNK_SIZE;
                  const sliceBlob = file.slice(offset, Math.min(offset + MQTT_CHUNK_SIZE, file.size));
                  const base64Chunk = await readBlobAsBase64(sliceBlob);
                  sendData({
                    type: "MQTT_CHUNK_DATA",
                    fileId: fileId,
                    index: i,
                    windowIndex: w,
                    isWindowEnd: (i === endIdx - 1),
                    chunk: base64Chunk
                  });
                  await new Promise(r => setTimeout(r, 8));
                }
              }
            }

            const elapsedSec = (Date.now() - startTime) / 1000;
            const speed = elapsedSec > 0 ? formatBytes(bytesSent / elapsedSec) + "/s" : "0 B/s";
            const pct = Math.min(100, Math.round((bytesSent / file.size) * 100));
            updateProgressText(file.name, bytesSent, file.size, `🛡️ MQTT流水線 [${speed}] ${pct}%`);
          }

          if (!isCancelled) {
            updateProgressText(file.name, bytesSent, file.size, "等待對端完成組裝校驗...");
            await Promise.race([
              new Promise(res => { resolveFinal = res; }),
              new Promise(res => setTimeout(res, 6000))
            ]);
          }

          resolve();
        });
      }

      function readBlobAsBase64(blob) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const commaIndex = dataUrl.indexOf(",");
            resolve(commaIndex !== -1 ? dataUrl.substring(commaIndex + 1) : dataUrl);
          };
          reader.readAsDataURL(blob);
        });
      }

      function base64ToUint8(base64) {
        const binStr = atob(base64);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        return bytes;
      }

      function showLocalPreview(file, isImage) {
        const localBlobUrl = URL.createObjectURL(file);
        if (isImage) {
          appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "image", true, myId);
        } else {
          appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "file", true, myId);
        }
      }

      function updateProgressText(fileName, sent, total, suffix) {
        const progText = document.getElementById("transfer-progress-text");
        if (progText) {
          progText.innerText = total > 0 ? `${fileName} (${formatBytes(sent)}/${formatBytes(total)}) - ${suffix}` : suffix;
        }
      }

      function cancelActiveUpload() {
        if (activeUploadTask) {
          activeUploadTask.cancel();
          activeUploadTask = null;
        }
        uploadQueue.length = 0;
        document.getElementById("transfer-progress-bar").classList.add("hidden");
        document.getElementById("transfer-progress-bar").classList.remove("flex");
        appendNotice("// 已手動中止傳輸任務。");
      }

      /* ============================================================
         4. 接收端多通道數據流處理 (自動拼裝)
         ============================================================ */
      function handleDataChannelMessage(data, senderId) {
        if (typeof data === "string") {
          try {
            const meta = JSON.parse(data);
            if (meta.cmd === "FILE_START") {
              initIncomingFileRecord(meta.fileId, meta.fileName, meta.fileType, meta.fileSize, meta.totalChunks, meta.isImage, meta.senderName, meta.senderAvatar, senderId, "P2P直連");
            }
          } catch(e){}
          return;
        }

        if (data instanceof ArrayBuffer) {
          const view = new DataView(data);
          const chunkIdx = view.getUint32(0);
          const totalChunks = view.getUint32(4);
          const rawSlice = data.slice(8);

          let pack = null;
          let fid = null;
          incomingFiles.forEach((p, k) => {
            if (p.totalChunks === totalChunks && p.senderId === senderId && !pack) {
              pack = p;
              fid = k;
            }
          });

          if (!pack) return;

          if (!pack.chunks[chunkIdx]) {
            pack.chunks[chunkIdx] = rawSlice;
            pack.receivedCount++;
            pack.receivedBytes += rawSlice.byteLength;
            updateIncomingUI(pack, "P2P直連");
          }

          if (pack.receivedCount === pack.totalChunks) {
            finishReceivedFile(fid, pack);
          }
        }
      }

      function handleMqttFileStart(msg) {
        initIncomingFileRecord(msg.fileId, msg.fileName, msg.fileType, msg.fileSize, msg.totalChunks, msg.isImage, msg.name, msg.avatar, msg.senderId, "MQTT流水線");
      }

      function handleMqttChunkData(msg) {
        const pack = incomingFiles.get(msg.fileId);
        if (!pack) return;

        if (!pack.chunks[msg.index]) {
          const uint8 = base64ToUint8(msg.chunk);
          pack.chunks[msg.index] = uint8;
          pack.receivedCount++;
          pack.receivedBytes += uint8.length;
          updateIncomingUI(pack, "MQTT流水線");
        }

        // 遇到視窗末端或是最後一片時，回傳 Window ACK
        if (msg.isWindowEnd || msg.index === pack.totalChunks - 1) {
          sendData({
            type: "MQTT_WINDOW_ACK",
            targetId: msg.senderId,
            fileId: msg.fileId,
            windowIndex: msg.windowIndex
          });
        }

        if (pack.receivedCount === pack.totalChunks) {
          finishReceivedFile(msg.fileId, pack);
        }
      }

      function initIncomingFileRecord(fileId, fileName, fileType, fileSize, totalChunks, isImage, senderName, senderAvatar, senderId, mode) {
        const placeholderId = "box_" + fileId;
        incomingFiles.set(fileId, {
          chunks: new Array(totalChunks),
          receivedCount: 0,
          receivedBytes: 0,
          totalChunks,
          fileName,
          fileType,
          fileSize,
          isImage,
          senderName,
          senderAvatar,
          senderId,
          placeholderId,
          startTime: Date.now()
        });

        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.id = placeholderId;
        row.className = "flex gap-3 max-w-[85%] self-start flex-row";
        row.innerHTML = `
          <img src="${senderAvatar}" class="w-8 h-8 rounded-lg object-cover border border-cyan-500/40 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col items-start">
            <span class="text-xs font-mono-tech text-cyan-400 mb-1 px-1">${senderName}</span>
            <div class="p-3 rounded-lg bg-[#060b17] border border-cyan-500/30 flex items-center gap-2 text-xs font-mono-tech text-cyan-300">
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
              <span id="${placeholderId}_txt">📥 [${mode}] 接收數據: 0 B / ${formatBytes(fileSize)} (0%)</span>
            </div>
          </div>
        `;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function updateIncomingUI(pack, modeLabel) {
        if (pack.receivedCount % 8 === 0 || pack.receivedCount === pack.totalChunks) {
          const txt = document.getElementById(pack.placeholderId + "_txt");
          if (txt) {
            const pct = Math.round((pack.receivedCount / pack.totalChunks) * 100);
            const elapsed = (Date.now() - pack.startTime) / 1000;
            const spd = elapsed > 0 ? formatBytes(pack.receivedBytes / elapsed) + "/s" : "";
            txt.innerText = `📥 [${modeLabel}] 寫入中: ${formatBytes(pack.receivedBytes)} / ${formatBytes(pack.fileSize)} (${pct}%) [${spd}]`;
          }
        }
      }

      function finishReceivedFile(fileId, pack) {
        const fullBlob = new Blob(pack.chunks, { type: pack.fileType });
        const objectUrl = URL.createObjectURL(fullBlob);

        finalizeReceivedFile(pack, objectUrl);

        sendData({
          type: "TRANSFER_CONFIRMED",
          targetId: pack.senderId,
          fileId: fileId
        });

        pack.chunks = null;
        incomingFiles.delete(fileId);
      }

      function finalizeReceivedFile(pack, objectUrl) {
        const row = document.getElementById(pack.placeholderId);
        if (!row) return;

        const contentDiv = row.querySelector(".flex-col");
        if (pack.isImage) {
          contentDiv.innerHTML = `
            <span class="text-xs font-mono-tech text-cyan-400 mb-1 px-1">${pack.senderName}</span>
            <div class="p-2.5 rounded-lg bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${objectUrl}" class="max-w-full max-h-[260px] rounded object-contain cursor-pointer hover:opacity-90" onclick="showBigImage('${objectUrl}')" />
              <div class="flex justify-between items-center pt-1 border-t border-cyan-500/20 font-mono-tech">
                <span class="text-[11px] text-slate-300 truncate max-w-[140px]">${pack.fileName} (${formatBytes(pack.fileSize)})</span>
                <a href="${objectUrl}" download="${pack.fileName}" class="cyber-btn px-2.5 py-1 text-[10px] rounded">下載</a>
              </div>
            </div>
          `;
        } else {
          contentDiv.innerHTML = `
            <span class="text-xs font-mono-tech text-cyan-400 mb-1 px-1">${pack.senderName}</span>
            <div class="p-3 rounded-lg bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 min-w-[220px] max-w-sm font-mono-tech">
              <div class="flex items-center gap-2 font-bold text-cyan-300 text-xs">
                <span class="text-base">💾</span>
                <span class="truncate">${pack.fileName}</span>
              </div>
              <div class="text-[10px] text-slate-400">完整大小: ${formatBytes(pack.fileSize)}</div>
              <div class="flex justify-end pt-1 border-t border-cyan-500/20">
                <a href="${objectUrl}" download="${pack.fileName}" class="cyber-btn w-full text-center py-1.5 text-[11px] rounded">提取完整檔案</a>
              </div>
            </div>
          `;
        }
        document.getElementById("chat-scroller").scrollTop = document.getElementById("chat-scroller").scrollHeight;
      }

      /* ============================================================
         5. 介面互動與聊天文字常規功能
         ============================================================ */
      function sendTextMessage() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        appendChatMessage(myName, text, myAvatar, "text", true, myId);
        sendData({ type: "CHAT_TEXT", name: myName, avatar: myAvatar, text: text });
        input.value = "";
        input.focus();
      }

      function renderMemberList() {
        const container = document.getElementById("player-list");
        document.getElementById("online-count").innerText = members.size;
        container.innerHTML = "";

        members.forEach((user, id) => {
          const isMe = (id === myId);
          const shortId = id.slice(-3);
          const row = document.createElement("div");
          row.className = "flex items-center justify-between bg-slate-900/60 px-2.5 py-1.5 rounded-lg border border-cyan-500/20 text-xs font-mono-tech";
          row.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <img src="${user.avatar}" class="w-6 h-6 rounded-md object-cover border border-cyan-400/40 flex-shrink-0" />
              <span class="truncate ${isMe ? 'text-cyan-300 font-bold' : 'text-slate-300'}">
                ${user.name} <span class="text-[10px] text-slate-500">#${shortId}</span> ${isMe ? '<span class="text-[9px] text-cyan-400">(ME)</span>' : ''}
              </span>
            </div>
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_6px_#00f2fe] flex-shrink-0"></span>
          `;
          container.appendChild(row);
        });
      }

      function appendChatMessage(sender, data, avatar, type = "text", isMe = false, senderId = "") {
        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.className = `flex gap-3 max-w-[85%] ${isMe ? "self-end flex-row-reverse" : "self-start flex-row"}`;

        let innerContent = "";

        if (type === "text") {
          innerContent = `
            <div class="px-3.5 py-2 rounded-xl text-sm font-mono-tech break-words select-text ${
              isMe
                ? "bg-cyan-950/80 text-cyan-100 border border-cyan-400/50 shadow-[0_0_12px_rgba(0,242,254,0.15)]"
                : "bg-slate-900/90 text-slate-100 border border-slate-700/60"
            }">${data}</div>
          `;
        } else if (type === "image") {
          const { url, fileName, fileSize } = data;
          innerContent = `
            <div class="p-2 rounded-lg bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${url}" class="max-w-full max-h-[260px] rounded object-contain cursor-pointer hover:opacity-90" onclick="showBigImage('${url}')" />
              <div class="flex justify-between items-center pt-1 border-t border-cyan-500/20 font-mono-tech">
                <span class="text-[10px] text-slate-400 truncate max-w-[140px]">${fileName} (${formatBytes(fileSize)})</span>
                <a href="${url}" download="${fileName}" class="cyber-btn px-2 py-0.5 text-[10px] rounded">下載</a>
              </div>
            </div>
          `;
        } else if (type === "file") {
          const { fileName, url, fileSize } = data;
          innerContent = `
            <div class="p-3 rounded-lg bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 min-w-[200px] max-w-sm font-mono-tech">
              <div class="flex items-center gap-2 font-bold text-cyan-300 text-xs">
                <span class="text-base">💾</span>
                <span class="truncate">${fileName}</span>
              </div>
              <div class="text-[10px] text-slate-400">大小: ${formatBytes(fileSize)}</div>
              <div class="flex justify-end pt-1 border-t border-cyan-500/20">
                <a href="${url}" download="${fileName}" class="cyber-btn w-full text-center py-1.5 text-[10px] rounded">下載檔案</a>
              </div>
            </div>
          `;
        }

        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-cyan-500/40 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col ${isMe ? "items-end" : "items-start"}">
            <span class="text-xs font-mono-tech ${isMe ? "text-cyan-400" : "text-slate-400"} mb-1 px-1">${sender}</span>
            ${innerContent}
          </div>
        `;

        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function appendNotice(text) {
        const box = document.getElementById("chat-scroller");
        const notice = document.createElement("div");
        notice.className = "text-[11px] text-cyan-300 font-mono-tech text-center my-1.5 bg-cyan-950/40 py-1 px-4 rounded-full self-center border border-cyan-500/30 tracking-wider";
        notice.textContent = text;
        box.appendChild(notice);
        box.scrollTop = box.scrollHeight;
      }

      function showBigImage(src) {
        document.getElementById("image-modal-preview").src = src;
        document.getElementById("image-modal").classList.remove("hidden");
      }

      function startHeartbeat() {
        pingLoop = setInterval(() => {
          sendData({ type: "HEARTBEAT", name: myName, avatar: myAvatar });
          const otherIds = Array.from(members.keys()).filter(id => id !== myId);
          if (otherIds.length > 0) {
            const target = otherIds[Math.floor(Math.random() * otherIds.length)];
            sendData({ type: "PING", target: target, time: performance.now() });
          }
        }, 3500);

        checkLoop = setInterval(() => {
          const now = Date.now();
          let changed = false;
          members.forEach((user, id) => {
            if (id !== myId && now - user.lastSeen > 9500) {
              members.delete(id);
              changed = true;
            }
          });
          if (changed) renderMemberList();
        }, 2000);
      }

      function leaveLobby() {
        if (pingLoop) clearInterval(pingLoop);
        if (checkLoop) clearInterval(checkLoop);

        closeAllPeers();

        if (client) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
          client.end(true);
          client = null;
        }

        members.clear();
        uploadQueue.length = 0;
        document.getElementById("lobby-panel").classList.add("hidden");
        document.getElementById("login-panel").classList.remove("hidden");
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("conn-hint").innerText = "STATUS: DISCONNECTED";
      }

      window.onload = () => {
        resetDefaultAvatar();
      };

      window.addEventListener("beforeunload", () => {
        if (client && client.connected) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
        }
      });
    </script>
  </body>
</html>

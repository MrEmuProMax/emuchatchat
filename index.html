<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>科技聊天大廳</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js 通訊庫 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- 科技字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --cyan-glow: #00f2fe;
        --cyan-dark: #071322;
        --dark-bg: #060913;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: var(--dark-bg);
        font-family: "Chakra Petch", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }
      .font-mono-tech {
        font-family: "JetBrains Mono", monospace;
      }
      /* 科技感背景網格 */
      .tech-grid-bg {
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.08) 0%, transparent 80%),
          linear-gradient(to right, rgba(0, 242, 254, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
        background-size: 100% 100%, 32px 32px, 32px 32px;
      }
      .glow-box {
        background: rgba(10, 16, 30, 0.92);
        border: 1px solid rgba(0, 242, 254, 0.35);
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.12), inset 0 0 15px rgba(0, 242, 254, 0.04);
      }
      .cyber-btn {
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(56, 189, 248, 0.1) 100%);
        border: 1px solid rgba(0, 242, 254, 0.5);
        color: #00f2fe;
        transition: all 0.2s ease;
      }
      .cyber-btn:hover {
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.3) 0%, rgba(56, 189, 248, 0.25) 100%);
        border-color: #00f2fe;
        box-shadow: 0 0 14px rgba(0, 242, 254, 0.4);
      }
      .cyber-btn-primary {
        background: linear-gradient(135deg, #00f2fe 0%, #38bdf8 100%);
        color: #040914;
        font-weight: 700;
        border: none;
        box-shadow: 0 0 16px rgba(0, 242, 254, 0.45);
      }
      .cyber-btn-primary:hover {
        background: linear-gradient(135deg, #38f9d7 0%, #00f2fe 100%);
        box-shadow: 0 0 22px rgba(56, 249, 215, 0.65);
      }
      .cyber-input {
        background: rgba(7, 12, 24, 0.9);
        border: 1px solid rgba(0, 242, 254, 0.3);
        color: #ffffff;
        transition: all 0.2s ease;
      }
      .cyber-input:focus {
        border-color: #00f2fe;
        outline: none;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.35);
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 242, 254, 0.35);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 242, 254, 0.6);
      }
      ::-webkit-scrollbar-track {
        background: rgba(6, 10, 18, 0.6);
      }
    </style>
  </head>
  <body class="tech-grid-bg text-slate-100 flex items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- 1. 科技登入終端 -->
    <div id="login-panel" class="relative z-10 w-full max-w-sm glow-box rounded-2xl p-7 flex flex-col gap-5 backdrop-blur-xl">
      <div class="text-center">
        <div class="inline-block px-3 py-0.5 rounded-full text-[11px] font-mono-tech text-cyan-400 bg-cyan-950/60 border border-cyan-500/30 mb-2">
          MQTT QoS 1 高可靠連線
        </div>
        <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400">
          科技聊天大廳
        </h1>
        <p class="text-xs text-slate-400 font-mono-tech mt-1">即時檔案與文字通訊平台</p>
      </div>

      <!-- 科技頭像選取區 -->
      <div class="flex items-center gap-3.5 bg-slate-950/80 border border-cyan-500/30 p-3 rounded-xl">
        <div class="relative group cursor-pointer w-14 h-14 rounded-xl bg-slate-900 border border-cyan-400/50 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-[0_0_10px_rgba(0,242,254,0.2)]" onclick="document.getElementById('avatar-file').click()">
          <img id="avatar-preview" src="" class="w-full h-full object-cover hidden" />
          <span id="avatar-placeholder" class="text-xs text-cyan-400 font-mono-tech">頭像</span>
          <div class="absolute inset-0 bg-cyan-950/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="text-[11px] text-cyan-300 font-medium font-mono-tech">更換</span>
          </div>
        </div>
        <input id="avatar-file" type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
        <div class="flex flex-col gap-1.5 flex-1">
          <div class="flex gap-2">
            <button type="button" onclick="document.getElementById('avatar-file').click()" class="cyber-btn px-2.5 py-1 text-xs rounded-lg font-mono-tech">
              自訂照片
            </button>
            <button type="button" onclick="resetDefaultAvatar()" class="cyber-btn px-2.5 py-1 text-xs rounded-lg font-mono-tech">
              隨機雷達
            </button>
          </div>
          <span class="text-[11px] text-slate-400 font-mono-tech">點擊左側頭像亦可直接上傳</span>
        </div>
      </div>

      <!-- 表單 -->
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-mono-tech text-cyan-400 mb-1.5 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> 你的暱稱
          </label>
          <input id="input-username" type="text" maxlength="12" value="Player" placeholder="輸入暱稱..."
            class="cyber-input w-full px-3.5 py-2.5 text-sm rounded-xl font-mono-tech" />
        </div>

        <button onclick="joinLobby()" class="cyber-btn-primary py-3 rounded-xl text-sm font-semibold tracking-wider transition-all duration-200 mt-1">
          進入公共大廳
        </button>

        <div id="conn-hint" class="text-xs font-mono-tech text-center text-slate-400">
          準備就緒
        </div>
      </div>
    </div>

    <!-- 2. 全屏聊天室主面板 -->
    <div id="lobby-panel" class="relative z-20 hidden w-[98vw] h-[95vh] max-w-7xl glow-box rounded-2xl shadow-2xl backdrop-blur-2xl flex overflow-hidden">
      
      <!-- [左側] 大廳切換欄 (公共大廳 + 自訂大廳) -->
      <div class="w-60 bg-[#050811]/95 border-r border-cyan-500/20 flex flex-col justify-between flex-shrink-0">
        <div>
          <div class="p-3.5 border-b border-cyan-500/20 flex items-center justify-between">
            <span class="text-xs font-bold text-cyan-300 font-mono-tech flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_6px_#00f2fe]"></span> 頻道列表
            </span>
            <button onclick="openCreateRoomModal()" title="自訂並加入大廳" class="cyber-btn px-2.5 py-1 text-xs rounded-lg font-mono-tech font-bold flex items-center gap-1">
              <span>＋ 自訂</span>
            </button>
          </div>

          <div class="p-2.5 flex flex-col gap-1.5 overflow-y-auto max-h-[calc(100vh-190px)]" id="room-list">
            <!-- 由 JS 動態生成大廳項目 -->
          </div>
        </div>

        <!-- 底部個人卡片 -->
        <div class="p-3 border-t border-cyan-500/20 bg-slate-950/70 flex items-center justify-between">
          <div class="flex items-center gap-2 overflow-hidden">
            <img id="my-profile-avatar" src="" class="w-8 h-8 rounded-lg object-cover border border-cyan-400/50 flex-shrink-0" />
            <div class="flex flex-col overflow-hidden">
              <span id="my-profile-name" class="text-xs font-bold text-cyan-200 font-mono-tech truncate">Player</span>
              <span class="text-[10px] text-emerald-400 font-mono-tech flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> QoS 1 在線
              </span>
            </div>
          </div>
          <button onclick="leaveLobby()" title="離開大廳" class="cyber-btn px-2.5 py-1 text-xs rounded-lg text-red-400 border-red-500/40 hover:border-red-400 hover:text-red-300 font-mono-tech">
            離開
          </button>
        </div>
      </div>

      <!-- [中央與右側] 主聊天室與在線名單 -->
      <div class="flex-1 flex flex-col justify-between overflow-hidden">
        
        <!-- 頂部資訊列 -->
        <div class="px-4 py-2.5 border-b border-cyan-500/20 bg-slate-900/40 flex justify-between items-center flex-shrink-0">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-[#050811] border border-cyan-500/40 px-3 py-1 rounded-lg">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="lobby-title" class="text-xs font-bold text-cyan-300 font-mono-tech tracking-wider">大廳: 公共大廳</span>
            </div>
            <span class="text-xs font-mono-tech text-slate-300">
              線上成員：<span id="online-count" class="text-emerald-400 font-bold">1</span> 人
            </span>
          </div>

          <div class="flex items-center gap-3">
            <span class="text-xs font-mono-tech text-slate-400">延遲：<span id="ping-stat" class="text-emerald-400 font-bold">0ms</span></span>
          </div>
        </div>

        <!-- 中央聊天訊息 + 在線人員名單 -->
        <div class="flex-1 flex overflow-hidden p-3 gap-3">
          <!-- 聊天捲軸區 -->
          <div class="flex-1 bg-[#050811]/80 border border-cyan-500/20 rounded-xl p-3.5 flex flex-col justify-between overflow-hidden">
            <div id="chat-scroller" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 text-sm"></div>
          </div>

          <!-- 右側在線人員 -->
          <div class="w-56 bg-[#050811]/80 border border-cyan-500/20 rounded-xl p-3 flex flex-col flex-shrink-0">
            <div class="text-xs font-mono-tech text-cyan-400 mb-2 pb-2 border-b border-cyan-500/20 flex justify-between items-center tracking-wider font-bold">
              <span>線上成員</span>
              <span class="text-emerald-400 text-[10px] font-normal">即時同步</span>
            </div>
            <div id="player-list" class="flex-1 overflow-y-auto flex flex-col gap-1.5"></div>
          </div>
        </div>

        <!-- 底部傳送工具列 -->
        <div class="p-3 border-t border-cyan-500/20 bg-slate-950/60 flex flex-col gap-2 flex-shrink-0">
          <div class="flex items-center gap-2">
            <input id="file-upload-input" type="file" multiple class="hidden" onchange="handleFilesSelected(event)" />

            <button onclick="document.getElementById('file-upload-input').click()" class="cyber-btn px-3 py-1.5 rounded-lg text-xs font-mono-tech flex items-center gap-1.5">
              <span>⚡ 傳送檔案</span>
            </button>

            <!-- 傳輸進度狀態列 -->
            <div id="transfer-progress-bar" class="hidden items-center gap-2 bg-[#050811] border border-cyan-500/40 px-3 py-1 rounded-lg text-xs font-mono-tech text-cyan-300">
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
              <span id="transfer-progress-text">準備傳輸中...</span>
              <button onclick="cancelActiveUpload()" class="ml-2 text-xs text-red-400 hover:text-red-300 underline font-bold">取消傳輸</button>
            </div>
          </div>

          <div class="flex gap-2">
            <input
              id="chat-input"
              type="text"
              maxlength="300"
              placeholder="輸入訊息... (按 Enter 發送)"
              onkeydown="if(event.key === 'Enter') sendTextMessage();"
              class="cyber-input flex-1 px-4 py-2.5 rounded-xl text-sm font-mono-tech"
            />
            <button onclick="sendTextMessage()" class="cyber-btn-primary px-6 py-2.5 rounded-xl text-xs font-mono-tech font-bold tracking-wider">
              發送
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 自訂大廳彈窗 Modal (解決 prompt 被阻擋問題) -->
    <div id="custom-room-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden p-4">
      <div class="glow-box w-full max-w-sm rounded-2xl p-6 flex flex-col gap-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-cyan-500/20 pb-2">
          <span class="text-sm font-bold text-cyan-300 font-mono-tech flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400"></span> 創建 / 加入自訂大廳
          </span>
          <button onclick="closeCreateRoomModal()" class="text-slate-400 hover:text-white font-mono-tech text-sm">✕</button>
        </div>
        <div>
          <label class="block text-xs font-mono-tech text-slate-300 mb-1.5">大廳名稱</label>
          <input id="custom-room-input" type="text" maxlength="15" placeholder="輸入自訂大廳名稱..."
            onkeydown="if(event.key === 'Enter') confirmCreateRoom();"
            class="cyber-input w-full px-3.5 py-2.5 text-sm rounded-xl font-mono-tech" />
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button onclick="closeCreateRoomModal()" class="cyber-btn px-4 py-2 rounded-lg text-xs font-mono-tech">
            取消
          </button>
          <button onclick="confirmCreateRoom()" class="cyber-btn-primary px-4 py-2 rounded-lg text-xs font-mono-tech font-bold">
            確定進入
          </button>
        </div>
      </div>
    </div>

    <!-- 圖片點擊放大預覽視窗 -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center hidden p-4" onclick="this.classList.add('hidden')">
      <img id="image-modal-preview" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl border border-cyan-400/50 shadow-[0_0_30px_rgba(0,242,254,0.3)]" />
    </div>

    <script>
      /* ============================================================
         1. 核心網路通訊與大廳狀態管理 (一律 QOS 1)
         ============================================================ */
      const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
      const LOBBY_PREFIX = "chat_reliable_v3/";
      
      let myId = "";
      let client = null;
      let myName = "Player";
      let myAvatar = "";

      // 頻道列表（只有公共大廳與自訂大廳）
      const availableRooms = ["公共大廳"];
      let currentRoom = "公共大廳";
      let currentTopic = "";

      const members = new Map();
      let pingLoop = null;
      let checkLoop = null;

      // 傳輸佇列與任務狀態
      const uploadQueue = [];
      let totalBatchFiles = 0;
      let completedBatchFiles = 0;
      const activeUploads = new Map();
      const incomingFiles = new Map();

      // 切片大小：64KB，在 QoS 1 下具備極佳的傳輸穩定度與確認速度
      const CHUNK_SIZE = 64 * 1024;

      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      // 生成科技風格幾何雷達頭像
      function makeDefaultAvatar(char = "P") {
        const colors = ["#00f2fe", "#38bdf8", "#818cf8", "#34d399", "#f472b6"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <rect width="64" height="64" fill="#080e1b"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="6 3"/>
          <circle cx="32" cy="32" r="20" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1.5"/>
          <path d="M 32 4 L 32 60 M 4 32 L 60 32" stroke="${color}" stroke-opacity="0.2" stroke-width="1"/>
          <text x="32" y="41" font-size="24" font-family="'JetBrains Mono', monospace" font-weight="700" fill="${color}" text-anchor="middle">${char.slice(0, 1).toUpperCase()}</text>
        </svg>`;
        return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
      }

      function resetDefaultAvatar() {
        const name = document.getElementById("input-username").value.trim() || "P";
        myAvatar = makeDefaultAvatar(name);
        setAvatarImg(myAvatar);
      }

      function setAvatarImg(src) {
        const img = document.getElementById("avatar-preview");
        img.src = src;
        img.classList.remove("hidden");
        document.getElementById("avatar-placeholder").classList.add("hidden");
      }

      function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const cv = document.createElement("canvas");
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext("2d");
            const minSide = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - minSide) / 2, (img.height - minSide) / 2, minSide, minSide, 0, 0, 64, 64);
            myAvatar = cv.toDataURL("image/webp", 0.75);
            setAvatarImg(myAvatar);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getSafeTopic(roomName) {
        let hash = 0;
        for (let i = 0; i < roomName.length; i++) hash = ((hash << 5) - hash) + roomName.charCodeAt(i);
        return "room_" + Math.abs(hash);
      }

      function readSliceAsBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const commaIndex = dataUrl.indexOf(",");
            resolve(commaIndex !== -1 ? dataUrl.substring(commaIndex + 1) : dataUrl);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function base64ToUint8(base64) {
        const binStr = atob(base64);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        return bytes;
      }

      // 發送 MQTT 訊息：一律強制 QOS 1
      function sendData(data) {
        if (!client || !client.connected) return false;
        data.senderId = myId;
        client.publish(currentTopic, JSON.stringify(data), { qos: 1 });
        return true;
      }

      /* ============================================================
         2. 自訂大廳與頻道切換 (Modal 實作，解決 prompt 阻擋)
         ============================================================ */
      function openCreateRoomModal() {
        document.getElementById("custom-room-input").value = "";
        document.getElementById("custom-room-modal").classList.remove("hidden");
        document.getElementById("custom-room-input").focus();
      }

      function closeCreateRoomModal() {
        document.getElementById("custom-room-modal").classList.add("hidden");
      }

      function confirmCreateRoom() {
        const input = document.getElementById("custom-room-input");
        const roomName = input.value.trim();
        if (!roomName) return;

        if (!availableRooms.includes(roomName)) {
          availableRooms.push(roomName);
        }
        closeCreateRoomModal();
        switchRoom(roomName);
      }

      function renderRoomList() {
        const container = document.getElementById("room-list");
        container.innerHTML = "";

        availableRooms.forEach(room => {
          const isActive = (room === currentRoom);
          const btn = document.createElement("button");
          btn.onclick = () => switchRoom(room);
          btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-mono-tech transition-all flex items-center justify-between ${
            isActive
              ? "bg-cyan-950/70 border border-cyan-400 text-cyan-300 font-bold shadow-[0_0_12px_rgba(0,242,254,0.2)]"
              : "text-slate-400 hover:bg-slate-900/60 hover:text-slate-200 border border-transparent"
          }`;
          btn.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span class="text-xs ${isActive ? 'text-cyan-400' : 'text-slate-600'}">#</span>
              <span class="truncate">${room}</span>
            </div>
            ${isActive ? '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_6px_#00f2fe] flex-shrink-0"></span>' : ''}
          `;
          container.appendChild(btn);
        });
      }

      function switchRoom(newRoom) {
        if (!client || !client.connected) return;
        if (currentRoom === newRoom) return;

        // 1. 離開舊大廳 (QoS 1)
        sendData({ type: "PLAYER_LEAVE", name: myName });
        client.unsubscribe(currentTopic);

        // 2. 切換大廳並重置狀態
        currentRoom = newRoom;
        currentTopic = LOBBY_PREFIX + getSafeTopic(currentRoom);

        members.clear();
        members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("lobby-title").innerText = `大廳: ${currentRoom}`;
        renderMemberList();
        renderRoomList();

        appendNotice(`已切換至 [${currentRoom}]`);

        // 3. 訂閱新大廳主題 (QoS 1)
        client.subscribe(currentTopic, { qos: 1 }, (err) => {
          if (!err) {
            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
          }
        });
      }

      function joinLobby() {
        myId = "u_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

        const nameInput = document.getElementById("input-username").value.trim();
        myName = nameInput || "Player";
        if (!myAvatar) myAvatar = makeDefaultAvatar(myName);

        currentRoom = "公共大廳";
        currentTopic = LOBBY_PREFIX + getSafeTopic(currentRoom);

        document.getElementById("conn-hint").innerText = "連線中 (QoS 1)...";

        // 連線與遺言強制 QoS 1
        client = mqtt.connect(BROKER_URL, {
          clientId: myId,
          clean: true,
          connectTimeout: 10000,
          reconnectPeriod: 2000,
          will: {
            topic: currentTopic,
            payload: JSON.stringify({ type: "PLAYER_LEAVE", senderId: myId, name: myName }),
            qos: 1
          }
        });

        client.on("connect", () => {
          client.subscribe(currentTopic, { qos: 1 }, (err) => {
            if (err) {
              alert("大廳連線失敗，請重試！");
              leaveLobby();
              return;
            }

            document.getElementById("login-panel").classList.add("hidden");
            document.getElementById("lobby-panel").classList.remove("hidden");
            document.getElementById("lobby-title").innerText = `大廳: ${currentRoom}`;
            document.getElementById("my-profile-name").innerText = myName;
            document.getElementById("my-profile-avatar").src = myAvatar;

            renderRoomList();
            members.set(myId, { name: myName, avatar: myAvatar, lastSeen: Date.now() });
            renderMemberList();

            appendNotice(`歡迎來到公共大廳！(QoS 1 已就緒)`);

            sendData({ type: "HELLO", name: myName, avatar: myAvatar });
            startHeartbeat();
          });
        });

        client.on("message", (topic, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.senderId === myId) return;
            handleMessage(msg);
          } catch (e) {}
        });

        client.on("error", () => {
          document.getElementById("conn-hint").innerText = "連線短暫不穩定，自動重連中...";
        });
      }

      function handleMessage(msg) {
        const senderId = msg.senderId;
        if (!senderId) return;

        switch (msg.type) {
          case "CHAT_TEXT":
            appendChatMessage(msg.name, msg.text, msg.avatar, "text", false, senderId);
            break;

          // 步驟 1: 傳送端告知總封包數
          case "FILE_HEADER_START":
            handleFileHeaderStart(msg);
            break;

          // 步驟 2: 每個封包最前面帶有編號
          case "FILE_CHUNK_DATA":
            handleFileChunkData(msg);
            break;

          // 步驟 3: 傳送端發送結束，接收端核對缺失
          case "SENDER_TRANSFER_END":
            handleSenderTransferEnd(msg);
            break;

          // 步驟 4: 傳送端收到接收端的缺失清單，進行補發
          case "REQUEST_MISSING_CHUNKS":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.onMissingRequested) {
                task.onMissingRequested(msg.missingIndexes);
              }
            }
            break;

          // 步驟 5: 接收端傳送結束通知，傳送端才真正認定傳輸完成！
          case "RECEIVER_TRANSFER_COMPLETE":
            if (msg.targetId === myId && activeUploads.has(msg.fileId)) {
              const task = activeUploads.get(msg.fileId);
              if (task && task.onCompleteConfirmed) {
                task.onCompleteConfirmed();
              }
            }
            break;

          case "FILE_TRANSFER_CANCEL":
            handleFileTransferCancel(msg);
            break;

          case "HELLO":
            appendNotice(`${msg.name} 加入了大廳`);
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            sendData({ type: "WELCOME", name: myName, avatar: myAvatar });
            break;

          case "WELCOME":
          case "HEARTBEAT":
            members.set(senderId, { name: msg.name, avatar: msg.avatar, lastSeen: Date.now() });
            renderMemberList();
            break;

          case "PLAYER_LEAVE":
            if (members.has(senderId)) {
              appendNotice(`${members.get(senderId).name} 離開了大廳`);
              members.delete(senderId);
              renderMemberList();
            }
            break;

          case "PING":
            if (msg.target === myId) sendData({ type: "PONG", target: senderId, time: msg.time });
            break;

          case "PONG":
            if (msg.target === myId) {
              const ping = Math.round(performance.now() - msg.time);
              document.getElementById("ping-stat").innerText = `${ping}ms`;
            }
            break;
        }
      }

      /* ============================================================
         3. 嚴謹可靠傳輸協議實作 (依據指定步驟，徹底解決提前結束問題)
         ============================================================ */
      function handleFilesSelected(e) {
        const files = Array.from(e.target.files);
        if (!files || files.length === 0) return;

        totalBatchFiles += files.length;
        for (const file of files) {
          uploadQueue.push(file);
        }
        e.target.value = "";

        processUploadQueue();
      }

      function processUploadQueue() {
        if (!client || !client.connected) {
          alert("尚未連線至伺服器！");
          uploadQueue.length = 0;
          return;
        }

        const progBar = document.getElementById("transfer-progress-bar");
        progBar.classList.remove("hidden");
        progBar.classList.add("flex");

        // 單一隊列順序傳送，確保缺漏核對與完成訊號不紊亂
        if (activeUploads.size === 0 && uploadQueue.length > 0) {
          const file = uploadQueue.shift();
          startReliableTransfer(file).then(() => {
            completedBatchFiles++;
            updateOverallProgress();
            checkFinishedAll();
            processUploadQueue();
          });
        }
        updateOverallProgress();
      }

      function checkFinishedAll() {
        if (activeUploads.size === 0 && uploadQueue.length === 0) {
          const progText = document.getElementById("transfer-progress-text");
          progText.innerText = "🎉 接收端已全部核對完成，傳輸結束！";
          setTimeout(() => {
            if (uploadQueue.length === 0 && activeUploads.size === 0) {
              const progBar = document.getElementById("transfer-progress-bar");
              progBar.classList.add("hidden");
              progBar.classList.remove("flex");
              totalBatchFiles = 0;
              completedBatchFiles = 0;
            }
          }, 1500);
        }
      }

      function updateOverallProgress() {
        const progText = document.getElementById("transfer-progress-text");
        if (!progText) return;

        if (activeUploads.size > 0 || uploadQueue.length > 0) {
          let activeSummary = [];
          activeUploads.forEach((task) => {
            activeSummary.push(`${task.fileName} [${task.statusText}]`);
          });
          progText.innerText = `進度 [${completedBatchFiles}/${totalBatchFiles}] 佇列: ${uploadQueue.length} | ${activeSummary.join(" | ")}`;
        }
      }

      function startReliableTransfer(file) {
        return new Promise(async (resolve) => {
          const isImage = file.type.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(file.name);
          const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
          const fileId = "f_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

          // 本地即時預覽
          const localBlobUrl = URL.createObjectURL(file);
          if (isImage) {
            appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "image", true, myId);
          } else {
            appendChatMessage(myName, { url: localBlobUrl, fileName: file.name, fileSize: file.size }, myAvatar, "file", true, myId);
          }

          let isResolved = false;
          const finishTask = () => {
            if (isResolved) return;
            isResolved = true;
            activeUploads.delete(fileId);
            resolve();
          };

          const task = {
            fileName: file.name,
            fileSize: file.size,
            statusText: "傳送中 0%",
            file,
            totalChunks,
            isCancelled: false,
            sentChunks: new Set(),
            onMissingRequested: null,
            onCompleteConfirmed: null
          };
          activeUploads.set(fileId, task);

          // 步驟 1: 先傳送一個數字代表所有封包數 (totalChunks)
          sendData({
            type: "FILE_HEADER_START",
            fileId: fileId,
            totalChunks: totalChunks, // 傳送封包總數
            fileName: file.name,
            fileSize: file.size,
            fileType: file.type || "application/octet-stream",
            isImage: isImage,
            name: myName,
            avatar: myAvatar
          });

          // 步驟 2: 每個封包最前面都會跟著編號 (index)
          async function sendBatch(indexesToSend) {
            for (const idx of indexesToSend) {
              if (task.isCancelled) return;

              const offset = idx * CHUNK_SIZE;
              const sliceBlob = file.slice(offset, Math.min(offset + CHUNK_SIZE, file.size));
              const base64Chunk = await readSliceAsBase64(sliceBlob);

              // 每個封包最前面附帶編號
              sendData({
                type: "FILE_CHUNK_DATA",
                fileId: fileId,
                index: idx, // 封包編號
                chunk: base64Chunk
              });

              task.sentChunks.add(idx);
              const pct = Math.round((task.sentChunks.size / totalChunks) * 100);
              task.statusText = `傳送中 ${pct}%`;
              updateOverallProgress();

              // 微小間隔維護 QoS 1 佇列最佳流通
              await new Promise(r => setTimeout(r, 6));
            }

            // 步驟 3: 傳送端最後傳送結束
            if (!task.isCancelled) {
              task.statusText = "已送出，等待接收端確認...";
              updateOverallProgress();

              sendData({
                type: "SENDER_TRANSFER_END",
                fileId: fileId
              });
            }
          }

          // 步驟 4 與 5: 傳送端嚴格等待接收端的回應！絕不自行判定傳送完畢
          let transferDone = false;

          // 步驟 5: 接收端傳送結束 -> 傳送端此時才能宣布傳輸完成！
          task.onCompleteConfirmed = () => {
            transferDone = true;
            task.statusText = "接收端已確認 100%";
            updateOverallProgress();
            finishTask();
          };

          // 步驟 4: 接收端回傳缺漏封包 -> 傳送端補發
          task.onMissingRequested = async (missingIndexes) => {
            if (task.isCancelled || transferDone) return;
            if (missingIndexes && missingIndexes.length > 0) {
              task.statusText = `補發缺漏 ${missingIndexes.length} 個封包...`;
              updateOverallProgress();
              await sendBatch(missingIndexes);
            }
          };

          // 首次將所有封包發出 (0 到 totalChunks - 1)
          const allIndexes = Array.from({ length: totalChunks }, (_, i) => i);
          await sendBatch(allIndexes);

          // 超時保護：若大廳確實沒有其他人上線接收，最多等待 15 秒保護釋放
          setTimeout(() => {
            if (!transferDone) {
              const otherMembers = Array.from(members.keys()).filter(id => id !== myId);
              if (otherMembers.length === 0) {
                appendNotice("提示：大廳內暫無其他成員在線接收檔案。");
              }
              finishTask();
            }
          }, 15000);
        });
      }

      function cancelActiveUpload() {
        uploadQueue.length = 0;
        totalBatchFiles = 0;
        completedBatchFiles = 0;
        activeUploads.forEach((task, fileId) => {
          task.isCancelled = true;
          sendData({ type: "FILE_TRANSFER_CANCEL", fileId: fileId });
        });
        activeUploads.clear();
        document.getElementById("transfer-progress-bar").classList.add("hidden");
        document.getElementById("transfer-progress-bar").classList.remove("flex");
        appendNotice("已取消所有傳輸任務。");
      }

      /* ============================================================
         接收端邏輯：
         1. 記錄總封包數與缺漏
         2. 記錄收到封包
         3. 傳送端結束時發送缺漏
         4. 到齊後接收端傳送結束
         ============================================================ */
      function handleFileHeaderStart(msg) {
        const { fileId, totalChunks, fileName, fileType, fileSize, isImage, name, avatar, senderId } = msg;
        const placeholderId = "box_" + fileId;

        // 初始化追蹤集合：missing 完整記錄未收到的編號
        const missingSet = new Set();
        for (let i = 0; i < totalChunks; i++) {
          missingSet.add(i);
        }

        incomingFiles.set(fileId, {
          chunks: new Array(totalChunks),
          totalChunks: totalChunks, // 步驟 1: 記錄所有封包數
          missing: missingSet,      // 接收端紀錄沒收到的封包
          receivedBytes: 0,
          totalBytes: fileSize,
          fileName: fileName,
          fileType: fileType,
          isImage: isImage,
          name: name,
          avatar: avatar,
          senderId: senderId,
          placeholderId: placeholderId
        });

        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.id = placeholderId;
        row.className = "flex gap-3 max-w-[85%] self-start flex-row";
        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-cyan-400/50 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col items-start">
            <span class="text-xs font-mono-tech text-cyan-300 mb-1 px-1">${name}</span>
            <div class="p-3 rounded-xl bg-[#060b17] border border-cyan-500/40 flex items-center gap-2 text-xs font-mono-tech text-cyan-300">
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
              <span id="${placeholderId}_txt">正在接收檔案: 0 / ${totalChunks} 封包 (0%)</span>
            </div>
          </div>
        `;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function handleFileChunkData(msg) {
        const { fileId, index, chunk } = msg;
        const pack = incomingFiles.get(fileId);
        if (!pack) return;

        // 接收端依編號存入並從 missing 集合中剔除
        if (!pack.chunks[index]) {
          const uint8 = base64ToUint8(chunk);
          pack.chunks[index] = uint8;
          pack.missing.delete(index);
          pack.receivedBytes += uint8.length;

          const txt = document.getElementById(pack.placeholderId + "_txt");
          if (txt) {
            const receivedCount = pack.totalChunks - pack.missing.size;
            const pct = Math.round((receivedCount / pack.totalChunks) * 100);
            txt.innerText = `正在接收檔案: ${receivedCount} / ${pack.totalChunks} 封包 (${pct}%)`;
          }
        }
      }

      function handleSenderTransferEnd(msg) {
        const pack = incomingFiles.get(msg.fileId);
        if (!pack) return;

        // 稍等 80ms 讓通道最後幾則訊息完全到位
        setTimeout(() => {
          // 步驟 4: 若還有缺漏，接收端開始發送缺漏封包編號
          if (pack.missing.size > 0) {
            const txt = document.getElementById(pack.placeholderId + "_txt");
            if (txt) txt.innerText = `正在請求補發缺漏的 ${pack.missing.size} 個封包...`;

            sendData({
              type: "REQUEST_MISSING_CHUNKS",
              targetId: pack.senderId,
              fileId: msg.fileId,
              missingIndexes: Array.from(pack.missing)
            });
          } else {
            // 步驟 5: 一直重複直到所有封包到齊 -> 接收端傳送結束 (QoS 1)
            sendData({
              type: "RECEIVER_TRANSFER_COMPLETE",
              targetId: pack.senderId,
              fileId: msg.fileId
            });

            // 組裝檔案
            const fullBlob = new Blob(pack.chunks, { type: pack.fileType });
            const objectUrl = URL.createObjectURL(fullBlob);
            finalizeReceivedFile(pack, objectUrl);

            pack.chunks = null;
            incomingFiles.delete(msg.fileId);
          }
        }, 80);
      }

      function handleFileTransferCancel(msg) {
        const pack = incomingFiles.get(msg.fileId);
        if (!pack) return;

        const el = document.getElementById(pack.placeholderId);
        if (el) {
          el.innerHTML = `<span class="text-xs text-red-400 font-mono-tech my-1 px-3 py-1 bg-red-950/40 rounded-lg border border-red-500/30">傳輸已取消。</span>`;
        }
        pack.chunks = null;
        incomingFiles.delete(msg.fileId);
      }

      function finalizeReceivedFile(pack, objectUrl) {
        const row = document.getElementById(pack.placeholderId);
        if (!row) return;

        const contentDiv = row.querySelector(".flex-col");
        if (pack.isImage) {
          contentDiv.innerHTML = `
            <span class="text-xs font-mono-tech text-cyan-300 mb-1 px-1">${pack.name}</span>
            <div class="p-2.5 rounded-xl bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${objectUrl}" class="max-w-full max-h-[260px] rounded-lg object-contain cursor-pointer hover:opacity-90" onclick="showBigImage('${objectUrl}')" />
              <div class="flex justify-between items-center pt-1 border-t border-cyan-500/20 font-mono-tech">
                <span class="text-xs text-slate-300 truncate max-w-[140px]">${pack.fileName} (${formatBytes(pack.totalBytes)})</span>
                <a href="${objectUrl}" download="${pack.fileName}" class="cyber-btn px-2.5 py-1 text-xs rounded-lg">下載</a>
              </div>
            </div>
          `;
        } else {
          contentDiv.innerHTML = `
            <span class="text-xs font-mono-tech text-cyan-300 mb-1 px-1">${pack.name}</span>
            <div class="p-3 rounded-xl bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 min-w-[220px] max-w-sm font-mono-tech">
              <div class="flex items-center gap-2 font-bold text-cyan-300 text-xs">
                <span class="text-base">📄</span>
                <span class="truncate">${pack.fileName}</span>
              </div>
              <div class="text-xs text-slate-400">大小: ${formatBytes(pack.totalBytes)}</div>
              <div class="flex justify-end pt-1 border-t border-cyan-500/20">
                <a href="${objectUrl}" download="${pack.fileName}" class="cyber-btn w-full text-center py-1.5 text-xs rounded-lg">下載檔案</a>
              </div>
            </div>
          `;
        }
        document.getElementById("chat-scroller").scrollTop = document.getElementById("chat-scroller").scrollHeight;
      }

      /* ============================================================
         4. 聊天常規訊息與名單渲染
         ============================================================ */
      function sendTextMessage() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        appendChatMessage(myName, text, myAvatar, "text", true, myId);
        sendData({ type: "CHAT_TEXT", name: myName, avatar: myAvatar, text: text });
        input.value = "";
        input.focus();
      }

      function renderMemberList() {
        const container = document.getElementById("player-list");
        document.getElementById("online-count").innerText = members.size;
        container.innerHTML = "";

        members.forEach((user, id) => {
          const isMe = (id === myId);
          const shortId = id.slice(-3);
          const row = document.createElement("div");
          row.className = "flex items-center justify-between bg-slate-900/60 px-2.5 py-1.5 rounded-lg border border-cyan-500/20 text-xs font-mono-tech";
          row.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <img src="${user.avatar}" class="w-6 h-6 rounded-md object-cover border border-cyan-400/40 flex-shrink-0" />
              <span class="truncate ${isMe ? 'text-cyan-300 font-bold' : 'text-slate-300'}">
                ${user.name} <span class="text-[10px] text-slate-500">#${shortId}</span> ${isMe ? '<span class="text-[10px] text-cyan-400">(你)</span>' : ''}
              </span>
            </div>
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_6px_#00f2fe] flex-shrink-0"></span>
          `;
          container.appendChild(row);
        });
      }

      function appendChatMessage(sender, data, avatar, type = "text", isMe = false, senderId = "") {
        const box = document.getElementById("chat-scroller");
        const row = document.createElement("div");
        row.className = `flex gap-2.5 max-w-[85%] ${isMe ? "self-end flex-row-reverse" : "self-start flex-row"}`;

        let innerContent = "";

        if (type === "text") {
          innerContent = `
            <div class="px-4 py-2.5 rounded-2xl text-sm font-mono-tech break-words select-text ${
              isMe
                ? "bg-cyan-950/80 text-cyan-100 border border-cyan-400/50 shadow-[0_0_12px_rgba(0,242,254,0.15)]"
                : "bg-slate-900/90 text-slate-100 border border-slate-700/60"
            }">${data}</div>
          `;
        } else if (type === "image") {
          const { url, fileName, fileSize } = data;
          innerContent = `
            <div class="p-2.5 rounded-xl bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 max-w-xs sm:max-w-sm">
              <img src="${url}" class="max-w-full max-h-[260px] rounded-lg object-contain cursor-pointer hover:opacity-90" onclick="showBigImage('${url}')" />
              <div class="flex justify-between items-center pt-1 border-t border-cyan-500/20 font-mono-tech">
                <span class="text-xs text-slate-300 truncate max-w-[140px]">${fileName} (${formatBytes(fileSize)})</span>
                <a href="${url}" download="${fileName}" class="cyber-btn px-2.5 py-1 text-xs rounded-lg">下載</a>
              </div>
            </div>
          `;
        } else if (type === "file") {
          const { fileName, url, fileSize } = data;
          innerContent = `
            <div class="p-3 rounded-xl bg-[#060b17] border border-cyan-500/30 flex flex-col gap-2 min-w-[200px] max-w-sm font-mono-tech">
              <div class="flex items-center gap-2 font-bold text-cyan-300 text-xs">
                <span class="text-base">📄</span>
                <span class="truncate">${fileName}</span>
              </div>
              <div class="text-xs text-slate-400">大小: ${formatBytes(fileSize)}</div>
              <div class="flex justify-end pt-1 border-t border-cyan-500/20">
                <a href="${url}" download="${fileName}" class="cyber-btn w-full text-center py-1.5 text-xs rounded-lg">下載檔案</a>
              </div>
            </div>
          `;
        }

        row.innerHTML = `
          <img src="${avatar}" class="w-8 h-8 rounded-lg object-cover border border-cyan-400/40 flex-shrink-0 mt-0.5" />
          <div class="flex flex-col ${isMe ? "items-end" : "items-start"}">
            <span class="text-xs font-mono-tech ${isMe ? "text-cyan-300" : "text-slate-400"} mb-1 px-1">${sender}</span>
            ${innerContent}
          </div>
        `;

        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function appendNotice(text) {
        const box = document.getElementById("chat-scroller");
        const notice = document.createElement("div");
        notice.className = "text-xs text-cyan-300 font-mono-tech text-center my-1.5 bg-cyan-950/40 py-1 px-3.5 rounded-full self-center border border-cyan-500/30";
        notice.textContent = text;
        box.appendChild(notice);
        box.scrollTop = box.scrollHeight;
      }

      function showBigImage(src) {
        document.getElementById("image-modal-preview").src = src;
        document.getElementById("image-modal").classList.remove("hidden");
      }

      function startHeartbeat() {
        pingLoop = setInterval(() => {
          sendData({ type: "HEARTBEAT", name: myName, avatar: myAvatar });
          const otherIds = Array.from(members.keys()).filter(id => id !== myId);
          if (otherIds.length > 0) {
            const target = otherIds[Math.floor(Math.random() * otherIds.length)];
            sendData({ type: "PING", target: target, time: performance.now() });
          }
        }, 3000);

        checkLoop = setInterval(() => {
          const now = Date.now();
          let changed = false;
          members.forEach((user, id) => {
            if (id !== myId && now - user.lastSeen > 8000) {
              members.delete(id);
              changed = true;
            }
          });
          if (changed) renderMemberList();
        }, 2000);
      }

      function leaveLobby() {
        if (pingLoop) clearInterval(pingLoop);
        if (checkLoop) clearInterval(checkLoop);

        if (client) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
          client.end(true);
          client = null;
        }

        members.clear();
        uploadQueue.length = 0;
        document.getElementById("lobby-panel").classList.add("hidden");
        document.getElementById("login-panel").classList.remove("hidden");
        document.getElementById("chat-scroller").innerHTML = "";
        document.getElementById("conn-hint").innerText = "已離開大廳";
      }

      window.onload = () => {
        resetDefaultAvatar();
      };

      window.addEventListener("beforeunload", () => {
        if (client && client.connected) {
          sendData({ type: "PLAYER_LEAVE", name: myName });
        }
      });
    </script>
  </body>
</html>
